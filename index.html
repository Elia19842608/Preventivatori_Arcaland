const CAS_ONERI = "• Gru per scarico, movimentazione e sollevamento al piano dell'orditura lignea;\n• Protesi speciali in acciaio per il fissaggio della struttura lignea alle murature portanti;\n• Qualsiasi parte muraria ed installazione di ponteggi occorrenti a norma di legge;\n• L'assistenza di un muratore e di un manovale per tutta la durata della posa;\n• Attività di scarico della \"fornitura\";\n• Eventuali opere di finitura non espressamente previste nel contratto;\n• Custodia dei materiali consegnati ed eventuale fornitura di telo in nylon per la loro protezione;\n• Fornitura di energia elettrica;\n• Predisposizione dell'area di scarico e/o di stoccaggio della \"fornitura\" sgombra da persone e cose e transitabile dai mezzi con cui la consegna è effettuata;\n• Ove necessario, la richiesta e l'ottenimento di eventuali permessi di accesso e/o transito e/o sosta;\n• La richiesta e l'ottenimento di ogni e qualsiasi titolo autorizzatorio per l'esecuzione e la posa in opera della \"fornitura\" (a titolo esemplificativo: Scia; Dia; permesso di costruire; dichiarazioni ecc.);\n• Accessibilità al cantiere per bilici e/o camion con rimorchio, con la precisazione che eventuali problemi di accesso non previsti che comportino maggiori oneri saranno computati ed addebitati a \"cliente\";\n• Redazione del piano di sicurezza concernente le lavorazioni affidate a \"fornitrice\" secondo quanto previsto dal D.Lgs. 9 aprile 2008 n. 81, con obbligo di comunicare a \"fornitrice\" il nominativo del responsabile della Sicurezza del cantiere;\n• Lo smaltimento dei materiali di risulta, al termine della posa in opera.";
const CAS_NOTE_LEGNO = "Il legno è un materiale \"vivo\" e come tale è soggetto a mutamenti nelle fasi di lavorazione o nel tempo.\n\nFORMA — Possono presentarsi nel tempo fessurazioni, imbarcamenti e micro-ritiri, dovuti alla natura stessa del materiale, pertanto non oggetto di contestazione.\n\nCOLORE — La tonalità di colore finale può differire leggermente rispetto alla campionatura proposta. In particolare, con impregnatura di tipo \"sbiancato\" e \"neutro\", potrebbe riaffiorare in superficie nel tempo la pigmentazione originaria del legno; tale effetto non è controllabile e dipende dalla natura stessa del legno, pertanto non può considerarsi oggetto di contestazione. Per ottenere una colorazione e copertura uniforme consigliamo di eseguire sempre, per qualsiasi tinta, una seconda mano di finitura, da eseguire in cantiere, a vostro carico, al termine dei lavori.\n\nMANUTENZIONE — L'aspetto esteriore del legno può modificarsi nel tempo, soprattutto nei casi in cui le parti siano esposte agli agenti atmosferici. Consigliamo di eseguire periodicamente attività di manutenzione con prodotti specifici, per preservare le caratteristiche originali del legno.";
const CAS_CONDIZIONI = "Validità offerta economica: 10 gg lavorativi dalla data di presentazione. Il presente preventivo è stato elaborato sulla base dei \"Disegni Esecutivi\" non ancora approvati dal cliente e, quindi, tenendo conto del costo dei materiali di quel momento. L'offerta si riterrà accettata a seguito della firma del preventivo, della relativa copia commissioni e della conferma dei disegni esecutivi entro 7 giorni dalla ricezione da parte di Zennaro Legnami.\nL'importo preventivato potrà subire variazioni in aumento nei seguenti casi:\n- Se i \"disegni esecutivi\" non vengono confermati entro il termine di sette giorni\n- Se si verificano aumenti dei costi dei materiali* e/o della manodopera superiori al decimo del prezzo\n- Se si verificano variazioni in aumento del costo delle materie prime e/o delle aliquote delle imposte e/o dei dazi doganali, in misura superiore al 5 (cinque)% rispetto ai costi e/o alle aliquote vigenti al momento della firma del contratto\n- Se durante l'esecuzione delle opere emergano difficoltà oggettive\n- Se, dopo la firma del contratto, il cliente richieda una qualsiasi variazione ai \"disegni esecutivi\"\nLa presa in carico del progetto sarà contestuale al saldo della caparra di acconto. È Vostro onere far pervenire al nostro Ufficio Tecnico nel più breve tempo possibile tutta la documentazione tecnica necessaria. Una volta ricevuta tale documentazione i nostri tecnici Vi forniranno i disegni esecutivi del progetto, i quali dovranno essere da Voi controfirmati entro 7 giorni per procedere con l'ordine del materiale. Il mancato rispetto di tali tempistiche potrà influire sui tempi di consegna concordati e potrà rendere necessaria una successiva revisione ed adeguamento degli importi preventivati.\n*La verifica dell'aumento dei costi delle materie prime è resa possibile a \"cliente\" mediante la consultazione degli indici di prezzo pubblicati dall'Osservatorio del mercato del legno di FederlegnoArredo, previa comunicazione da let cas = null;   // preventivo casetta in lavorazione

const casCosto = cod => { const v=listino.find(x=>x.cod===cod); return v? Number(v.costo)||0 : 0; };

function casNuovo(){
  cas = { id:null, numero:SEGNAPOSTO_NUM, data:new Date().toISOString().slice(0,10),
    cliente:"", ubicazione:"", agente:"", tecnico:"",
    modello:"BARCELLONA", dim:"300X400", copertura:"tegola canadese", colore:"noce",
    trasporto:0, posa:"SI", margine:param.margine??35, provv:param.provvigione??0,
    qfin:0, qporta:0, bianco:"NO", note:"" };
  vai("cas"); casRender();
}
function casSet(k,v){ cas[k]=v; casRender(); }

function casCalcola(){
  const sconto=(param.sconto??35)/100, margine=(Number(cas.margine)||0)/100, provv=(Number(cas.provv)||0)/100;
  const trasporto=Number(cas.trasporto)||0, posaSI=cas.posa==="SI", bianco=cas.bianco==="SI";
  const qfin=Math.max(0,Math.floor(Number(cas.qfin)||0)), qporta=Math.max(0,Math.floor(Number(cas.qporta)||0));
  const ceil10 = n => Math.ceil(n/10)*10;

  const costoCasetta=(casCosto(cas.dim))*(1-sconto);
  const costoFin=casCosto("OPT-FIN")*(1-sconto), costoPorta=casCosto("OPT-PORTA")*(1-sconto);
  const costoModifica=(qfin+qporta>0)? casCosto("OPT-MODIF") : 0;
  const costoOptStrutt=qfin*costoFin + qporta*costoPorta + costoModifica;

  const costoFornitura=costoCasetta + costoOptStrutt + trasporto;
  const prezzoFornitura=ceil10(costoFornitura/(1-margine)/(1-provv));

  const costoPosaBase=casCosto("POSA-CAS")+casCosto("POSA-IMPR");
  const costoPosa=posaSI? costoPosaBase : 0;
  const prezzoPosa=posaSI? ceil10(costoPosaBase/(1-(param.margposa??25)/100)) : 0;

  const righeOpt=[];
  if(qfin>0)   righeOpt.push({t:`Finestra aggiuntiva cm 70x70 (n° ${qfin})`, imp:qfin*(param.finprezzo??223)});
  if(qporta>0) righeOpt.push({t:`Porta singola aggiuntiva cm 70x195 (n° ${qporta})`, imp:qporta*(param.portaprezzo??435)});
  if(bianco)   righeOpt.push({t:"Impregnazione BIANCO", imp:param.biancoprezzo??450});
  const totOpt=righeOpt.reduce((a,r)=>a+r.imp,0);

  const imponibile=prezzoFornitura+prezzoPosa+totOpt;
  const iva=imponibile*(param.iva??22)/100;
  const costoTot=costoFornitura+costoPosa+(bianco? casCosto("OPT-BIANCO"):0);
  const margAss=imponibile-costoTot;

  return {costoCasetta,costoOptStrutt,costoModifica,costoFornitura,costoPosa,costoTot,
    prezzoFornitura,prezzoPosa,righeOpt,totOpt,imponibile,iva,totale:imponibile+iva,
    margAss, margPerc: imponibile>0? margAss/imponibile*100 : 0, posaSI, qfin, qporta, bianco};
}
function casDescrizione(m,copertura){
  const com1="Spess. pareti mm 28, completa di pavimento in perline cm 2,0. ";
  const com2=" Copertura in perline cm 2,0 + "+copertura+", LATTONERIA NON COMPRESA. Sporto frontale lato porta circa 70 cm, sporto laterale (3 lati) circa 25 cm.";
  if(m==="BARCELLONA") return com1+"Doppia porta finestra cm 140x195 mezzo vetro in bilama."+com2;
  return com1+"Porta finestra singola cm 70x195 mezzo vetro in bilama e finestra in legno cm 70x70 circa."+com2;
}

function casRender(){
  const c=casCalcola();
  const nome = cas.modello==="BARCELLONA"? "Barcellona" : "London";
  const cls = c.margPerc>=30? "ok" : (c.margPerc>=20? "" : "ko");
  document.getElementById("v-cas").innerHTML=`
  <div class="titolo-sez">
    <div><div class="eyebrow">Casette da giardino</div><h2>${numeroAssegnato(cas.numero)? "Preventivo "+esc(cas.numero) : "Nuovo preventivo"}</h2></div>
    <button class="btn btn-g" onclick="vai('cas-arch')">Torna all'archivio</button>
  </div>

  <div class="riepilogo">
    <div>
      <div class="card">
        <fieldset style="margin-bottom:18px"><legend>Modello</legend>
          <div class="opzioni">
            ${["BARCELLONA","LONDON"].map(m=>`

async function casSalva(){
  const c=casCalcola();
  try{
    if(!cas.id || !numeroAssegnato(cas.numero)) cas.numero = await prossimoNumero("casette");
    const corpo={prodotto:"casette", numero:cas.numero, nome:cas.modello+" "+cas.dim,
      cliente:cas.cliente, ubicazione:cas.ubicazione, agente:cas.agente, tecnico:cas.tecnico,
      data_offerta:cas.data, conf:cas,
      totali:{imponibile:c.imponibile, iva:c.iva, totale:c.totale, margPerc:+c.margPerc.toFixed(1)},
      creato_da:sess&&sess.uid};
    if(cas.id){ const r=await db("prev_offerte?id=eq."+cas.id,{method:"PATCH", body:corpo});
      const i=offerte.findIndex(x=>x.id===cas.id); if(i>=0) offerte[i]=r[0]; }
    else { const r=await db("prev_offerte",{method:"POST", body:corpo}); cas.id=r[0].id; offerte.unshift(r[0]); }
    casRender();
    toast(cas.cliente? "Preventivo "+cas.numero+" salvato"
                     : "Preventivo "+cas.numero+" salvato — ricordati di inserire il cliente");
  }catch(e){ toast("Salvataggio non riuscito: "+e.message); }
}
function casApri(i){ const o=offerte[i]; cas=Object.assign({}, o.conf, {id:o.id, numero:o.numero}); vai("cas"); casRender(); }
function casDuplica(i){ const o=offerte[i]; cas=Object.assign({}, o.conf, {id:null, numero:SEGNAPOSTO_NUM, data:new Date().toISOString().slice(0,10)}); vai("cas"); casRender(); toast("Preventivo duplicato: salva per assegnare il numero"); }
function casElimina(i){
  const o=offerte[i];
  chiedi("Eliminare il preventivo?", o.numero+(o.cliente? " per "+o.cliente:"")+" verrà tolto dall'archivio.",
    async ()=>{ try{ await db("prev_offerte?id=eq."+o.id,{method:"DELETE"}); offerte.splice(i,1); casRenderArchivio(); toast("Preventivo eliminato"); }
      catch(e){ toast("Eliminazione non riuscita: "+e.message); } });
}

const store = {
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k); return r? JSON.parse(r.value):null; } }catch(e){ return null; }
    try{ const v=localStorage.getItem(k); return v? JSON.parse(v):null; }catch(e){}

/* ---------- chiamate REST ---------- */
async function db(path, opt){
  opt = opt||{};
  const esegui = async () => fetch(SUPA_URL+"/rest/v1/"+path, {
    method: opt.method||"GET",
    headers: {
      apikey: SUPA_KEY,
      Authorization: "Bearer "+((sess&&sess.token)||SUPA_KEY),
      "Content-Type": "application/json",
      Prefer: opt.prefer || (opt.method&&opt.method!=="GET" ? "return=representation" : "")
    },
    body: opt.body? JSON.stringify(opt.body) : undefined
  });
  let r = await esegui();
  if(r.status===401 && sess && sess.refresh){ if(await rinnovaSessione()) r = await esegui(); }
  if(!r.ok){ throw new Error((await r.text()).slice(0,180)); }
  if(r.status===204) return null;
  const t = await r.text();
  return t? JSON.parse(t) : null;
}
async function rpc(nome, args){
  return db("rpc/"+nome, {method:"POST", body:args});
}

/* ---------- autenticazione ---------- */
async function entra(email, password){
  const r = await fetch(SUPA_URL+"/auth/v1/token?grant_type=password",{
    method:"POST", headers:{apikey:SUPA_KEY,"Content-Type":"application/json"},
    body: JSON.stringify({email, password})
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || d.message || "Accesso non riuscito");
  sess = {token:d.access_token, refresh:d.refresh_token, email:(d.user&&d.user.email)||email, uid:d.user&&d.user.id};
  await store.set("prev:sessione", sess);
  return sess;
}
async function rinnovaSessione(){
  try{
    const r = await fetch(SUPA_URL+"/auth/v1/token?grant_type=refresh_token",{
      method:"POST", headers:{apikey:SUPA_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({refresh_token:sess.refresh})
    });
    if(!r.ok) return false;
    const d = await r.json();
    sess = {token:d.access_token, refresh:d.refresh_token, email:(d.user&&d.user.email)||sess.email, uid:d.user&&d.user.id};
    await store.set("prev:sessione", sess);
    return true;
  }catch(e){ return false; }
}

   sono bloccati, quindi le conferme passano da questa finestra interna.

let azioneModale=null;
function chiudiModale(){ azioneModale=null; document.getElementById("modale").classList.add("hidden"); }
function confermaModale(){ const f=azioneModale; chiudiModale(); if(f) f(); }
function chiedi(titolo, testo, onOk, etichetta){
  azioneModale = onOk;
  const m=document.getElementById("modale");
  m.innerHTML = `<div class="modale-box">
    <h3>${esc(titolo)}</h3><p>${esc(testo)}</p>
    <div class="modale-az">
      <button class="btn btn-g" onclick="chiudiModale()">Annulla</button>
      <button class="btn btn-d" onclick="confermaModale()">${esc(etichetta||"Elimina")}</button>
    </div></div>`;
  m.classList.remove("hidden");
}
function chiediCategoria(){
  const cats = prodotto==="casette" ? ["Casette","Optional","Posa"] : ["Legname","Lavorazioni","Ferramenta","Posa"];
  const m=document.getElementById("modale");
  m.innerHTML = `<div class="modale-box">
    <h3>Nuovo articolo</h3><p>Scegli la categoria: potrai poi compilare codice, descrizione e prezzo direttamente in tabella.</p>
    <label>Categoria</label>
    <select id="nuova-cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select>
    <div class="modale-az" style="margin-top:18px">
      <button class="btn btn-g" onclick="chiudiModale()">Annulla</button>
      <button class="btn btn-p" onclick="creaVoce(document.getElementById('nuova-cat').value)">Aggiungi</button>
    </div></div>`;
  m.classList.remove("hidden");
}

let vistaCorrente="login";
const VISTE=["login","home","archivio","nuovo","listino","doc","cas","cas-arch","cas-doc"];
function vai(v){
  vistaCorrente=v;
  VISTE.forEach(x=>{ const s=document.getElementById("v-"+x); if(s) s.classList.toggle("hidden", x!==v); });
  renderTestata();
  if(v==="archivio") renderArchivio();
  if(v==="listino")  renderListino();
  if(v==="cas-arch") casRenderArchivio();
  window.scrollTo({top:0,behavior:"smooth"});
}

async function apriProdotto(p){
  try{
    await caricaProdotto(p);
    if(p==="staccionate") vai("archivio"); else vai("cas-arch");
  }catch(e){ toast("Non riesco a caricare i dati: "+e.message); }
}

/* =====================================================================

   ===================================================================== */
(async function avvio(){
  sess = await store.get("prev:sessione");
  renderTestata();
  if(sess && sess.refresh){
    try{
      await db("prev_impostazioni?select=chiave&limit=1");
      await vaiHome(); return;
    }catch(e){
      if(await rinnovaSessione()){ await vaiHome(); return; }
      sess=null;
    }
  }
  vai("login"); renderLogin();
})();
