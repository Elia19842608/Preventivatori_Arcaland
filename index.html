<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventivatore staccionate — Arcaland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --blu-900:#0B3A63; --blu-700:#14568F; --blu-500:#2C7AC0; --blu-100:#E4EEF6; --blu-050:#F2F7FB;
  --legno:#B08C4F; --legno-scuro:#7C6135; --acciaio:#8A939B;
  --testo:#1E2830; --testo-2:#5A6773; --linea:#D5DEE6; --err:#B3372F; --bg:#F6F8FA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--testo);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:"Barlow Condensed","Inter",sans-serif;letter-spacing:.02em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
#testata{background:linear-gradient(135deg,var(--blu-900),var(--blu-700));color:#fff;padding:0 24px;position:sticky;top:0;z-index:120;box-shadow:0 2px 12px rgba(11,58,99,.18)}
.head-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:28px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .mark{font-family:"Barlow Condensed";font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.08em}
.brand .sub{font-size:12px;text-transform:uppercase;letter-spacing:.16em;opacity:.75}
#testata nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
#testata nav button{background:transparent;border:0;color:#fff;opacity:.72;cursor:pointer;font-family:"Barlow Condensed";font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:10px 16px;border-radius:6px;transition:.15s}
#testata nav button:hover{opacity:1;background:rgba(255,255,255,.1)}
#testata nav button.on{opacity:1;background:rgba(255,255,255,.18)}
main{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
.card{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:22px}
.card + .card{margin-top:18px}
.titolo-sez{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px;flex-wrap:wrap}
.titolo-sez h2{margin:0;font-size:26px;text-transform:uppercase;font-weight:600;color:var(--blu-900)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--testo-2);font-weight:600;margin-bottom:6px}
.btn{font-family:"Barlow Condensed";font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:11px 20px;border-radius:6px;border:1px solid transparent;cursor:pointer;transition:.15s}
.btn-p{background:var(--blu-700);color:#fff} .btn-p:hover{background:var(--blu-900)}
.btn-s{background:#fff;color:var(--blu-700);border-color:var(--blu-700)} .btn-s:hover{background:var(--blu-050)}
.btn-g{background:#fff;color:var(--testo-2);border-color:var(--linea)} .btn-g:hover{background:#F0F3F6}
.btn-d{background:#fff;color:var(--err);border-color:#E6C3C0} .btn-d:hover{background:#FCF3F2}
.btn:disabled{opacity:.4;cursor:not-allowed}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--testo-2);margin-bottom:6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:6px;font-family:inherit;font-size:15px;background:#fff;color:var(--testo)}
input:focus,select:focus{outline:2px solid var(--blu-500);outline-offset:-1px;border-color:var(--blu-500)}
.riga{display:grid;gap:16px}
.c2{grid-template-columns:repeat(2,1fr)} .c3{grid-template-columns:repeat(3,1fr)} .c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.c2,.c3,.c4{grid-template-columns:1fr}}
.muted{color:var(--testo-2);font-size:13px}
.vuoto{text-align:center;padding:56px 20px;color:var(--testo-2)}
.vuoto h3{font-size:22px;color:var(--blu-900);margin:0 0 8px;text-transform:uppercase}
.griglia-std{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.std{border:1px solid var(--linea);border-radius:10px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.std .thumb{background:var(--blu-050);border-bottom:1px solid var(--linea);padding:6px}
.std .thumb svg{width:100%;display:block}
.std .body{padding:16px;flex:1}
.std h3{margin:0 0 4px;font-size:20px;text-transform:uppercase;color:var(--blu-900);font-weight:600}
.std .meta{font-size:12.5px;color:var(--testo-2);line-height:1.7}
.std .prezzo{margin-top:12px;font-family:"Barlow Condensed";font-size:26px;font-weight:700;color:var(--blu-700)}
.std .prezzo small{font-family:"Inter";font-size:12px;font-weight:500;color:var(--testo-2);text-transform:uppercase;letter-spacing:.08em}
.std .azioni{display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap}
.std .azioni .btn{padding:8px 14px;font-size:13px}
.steps{display:flex;margin-bottom:22px;flex-wrap:wrap}
.step-t{flex:1;min-width:140px;padding:12px 14px;background:#fff;border:1px solid var(--linea);border-right:0;cursor:pointer;transition:.15s;text-align:left}
.step-t:first-child{border-radius:8px 0 0 8px}
.step-t:last-child{border-right:1px solid var(--linea);border-radius:0 8px 8px 0}
.step-t.on{background:var(--blu-700);border-color:var(--blu-700);color:#fff}
.step-t.done{background:var(--blu-050)}
.step-t .n{font-family:"IBM Plex Mono";font-size:11px;opacity:.7;display:block}
.step-t .t{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;font-size:16px;letter-spacing:.04em}
@media(max-width:900px){.step-t{border-right:1px solid var(--linea);border-radius:8px!important;margin-bottom:6px}}
.opzioni{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.opz{border:1.5px solid var(--linea);border-radius:10px;background:#fff;padding:12px;cursor:pointer;text-align:left;transition:.15s;font-family:inherit;color:inherit}
.opz:hover{border-color:var(--blu-500);box-shadow:0 3px 10px rgba(20,86,143,.1)}
.opz.sel{border-color:var(--blu-700);background:var(--blu-050);box-shadow:0 0 0 3px rgba(20,86,143,.12)}
.opz svg{width:100%;display:block;margin-bottom:8px;background:#fff;border-radius:6px}
.opz .nome{font-family:"Barlow Condensed";font-size:18px;font-weight:600;text-transform:uppercase;color:var(--blu-900);line-height:1.15}
.opz .desc{font-size:12.5px;color:var(--testo-2);margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--linea);background:#fff;border-radius:20px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:500;transition:.15s;font-family:inherit;color:var(--testo)}
.chip:hover{border-color:var(--blu-500)}
.chip.sel{background:var(--blu-700);border-color:var(--blu-700);color:#fff}
.chip small{display:block;font-size:11px;opacity:.7;font-family:"IBM Plex Mono"}
.nav-wz{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
fieldset{border:0;padding:0;margin:0 0 24px}
fieldset legend{font-family:"Barlow Condensed";font-size:19px;font-weight:600;text-transform:uppercase;color:var(--blu-900);padding:0;margin-bottom:12px;letter-spacing:.04em}


/* ---------- documento di offerta ---------- */
.doc-barra{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.foglio{background:#fff;border:1px solid var(--linea);border-radius:6px;padding:42px 46px 36px;max-width:860px;margin:0 auto;color:#1B242C;font-size:13.5px;line-height:1.55}
.doc-head{position:static;display:flex;justify-content:space-between;align-items:flex-start;gap:32px;
  border-bottom:2px solid var(--blu-700);padding-bottom:16px;flex-wrap:wrap;background:#fff}
.doc-logo{flex:1 1 300px;min-width:0}
.doc-logo .logo-uff{display:block;width:260px;max-width:100%;height:auto}
.doc-logo .divisione{margin-top:8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#5A6773;font-weight:600}
.doc-num{flex:0 0 auto;display:grid;grid-template-columns:auto auto;gap:4px 14px;align-content:start;
  background:#F2F7FB;border:1px solid #D5E3EF;border-radius:6px;padding:12px 16px}
.doc-num .et{color:#5A6773;text-transform:uppercase;letter-spacing:.1em;font-size:9.5px;
  align-self:center;font-weight:600}
.doc-num .vl{font-family:"IBM Plex Mono";font-size:12.5px;color:#0B3A63;text-align:right;font-weight:500}
/* piè di pagina */
.doc-piede{margin-top:30px;padding-top:12px;border-top:2px solid var(--blu-700);text-align:center;background:#fff}
.doc-piede .piede-rag{font-family:"Barlow Condensed";font-size:15px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:#0B3A63}
.doc-piede .piede-riga{font-size:9.5px;color:#5A6773;line-height:1.55}
.doc-piede .piede-mod{font-size:8px;color:#93A0AB;margin-top:4px;letter-spacing:.08em}
.doc-cliente{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:20px 0 8px}
.doc-cliente .et{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--testo-2);margin-bottom:3px}
.doc-cliente input{font-size:14px;padding:7px 9px}
.solo-carta{display:none;font-weight:600;font-size:15px;color:var(--blu-900);border-bottom:1px solid var(--linea);padding-bottom:4px}
.doc-tit{font-size:23px;text-transform:uppercase;color:var(--blu-900);font-weight:600;margin:22px 0 6px;letter-spacing:.02em}
.doc-ogg{margin:0 0 16px}
.doc-dis{border:1px solid var(--linea);border-radius:4px;padding:6px;margin-bottom:18px}
.doc-dis svg{width:100%;height:auto;display:block}
.doc-sez{font-size:17px;text-transform:uppercase;color:var(--blu-900);font-weight:600;letter-spacing:.04em;margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--linea)}
.doc-list{margin:0;padding-left:18px}
.doc-list li{margin-bottom:4px}
.doc-tab{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.doc-tab th{background:var(--blu-050);border-bottom:1px solid var(--linea);padding:8px 10px;font-size:10.5px}
.doc-tab td{padding:9px 10px;border-bottom:1px solid #EDF1F4;vertical-align:top}
.doc-tab tfoot td{border-bottom:0;padding:6px 10px;font-weight:600;color:var(--blu-900)}
.doc-tab tfoot tr:first-child td{border-top:2px solid var(--linea);padding-top:10px}
.doc-tab tfoot tr.tot td{background:var(--blu-900);color:#fff;font-size:15px}
.doc-tab tfoot tr.alml td{background:#F2F7FB;color:var(--blu-900);border-top:2px solid var(--linea)}
.doc-tab tfoot tr.alml + tr td{border-top:0;padding-top:6px}
.doc-tab tfoot tr.alml td.num{font-family:"IBM Plex Mono";font-size:14px}
.doc-tab tfoot tr.tot td.num{font-family:"Barlow Condensed";font-size:22px;font-weight:700}
.doc-tab .num{text-align:right;font-family:"IBM Plex Mono";white-space:nowrap}
.doc-min{font-size:11.5px;color:var(--testo-2);margin:8px 0 0}
.doc-cond{width:100%;border-collapse:collapse;font-size:13px}
.doc-cond td{padding:7px 10px;border-bottom:1px solid #EDF1F4}
.doc-cond td:first-child{width:210px;color:var(--testo-2);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em}
.doc-firme{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:38px}
.doc-firme .et{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--testo-2)}
.doc-firme .riga-firma{border-bottom:1px solid #9AA6B0;height:44px}
.su-carta{border:0;border-radius:0;padding:0;max-width:none;font-size:12.5px}
.su-carta .pg-doc{padding:22px 26px}
.su-carta .pg-2{margin-top:0;padding-top:22px;border-top:0}
.su-carta .doc-logo .logo-uff{width:210px}
.su-carta .doc-cliente{margin:14px 0 4px}
.su-carta .doc-tit{font-size:20px;margin:14px 0 5px}
.su-carta .doc-ogg{margin-bottom:10px;font-size:12px}
.su-carta .doc-dis{margin-bottom:8px;padding:4px}
.su-carta .doc-sez{font-size:15px;margin:12px 0 6px}
.su-carta .doc-list li{margin-bottom:2px;font-size:12px}
.su-carta .doc-legenda{padding:8px 10px;gap:5px 14px;margin-top:6px}
.su-carta .doc-legenda .tt{font-size:11px}
.su-carta .doc-legenda em{font-size:10px}
.su-carta .doc-piede{margin-top:14px;padding-top:8px}
.su-carta .doc-firme{margin-top:22px}
.su-carta .doc-firme .riga-firma{height:34px}
.su-carta .doc-tab td{padding:7px 10px}
.su-carta .doc-cond td{padding:6px 10px}
.su-carta .doc-dis{margin-bottom:14px}
@media print{
  #testata,.doc-barra{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .foglio{border:0;border-radius:0;padding:0;max-width:none}
  .solo-video{display:none!important}
  .solo-carta{display:block!important}
  .doc-dis,.doc-tab,.doc-firme,.doc-cond,.doc-head,.doc-piede,.doc-legenda{break-inside:avoid;page-break-inside:avoid}
  .doc-head,.doc-piede{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-num{background:#F2F7FB!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-sez{break-after:avoid}
  @page{size:A4;margin:16mm 14mm}
}


/* ---------- accesso ---------- */
.accesso{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px}
.accesso-box{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:36px 34px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(11,58,99,.1)}
.marchio-grande{font-family:"Barlow Condensed";font-size:40px;font-weight:700;letter-spacing:.1em;color:var(--blu-900);text-align:center;line-height:1}
.accesso-box .sotto{text-align:center;color:var(--testo-2);font-size:13px;margin:4px 0 26px}
/* ---------- testata ---------- */
.brand{background:none;border:0;color:#fff;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:0;font-family:inherit}
.utente{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;opacity:.9}
.utente .esci{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-family:"Barlow Condensed";font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.utente .esci:hover{background:rgba(255,255,255,.26)}
/* ---------- scelta prodotto ---------- */
.scelta{max-width:900px;margin:20px auto}
.scelta-tit{text-align:center;margin-bottom:26px}
.scelta-tit h2{margin:0;font-size:30px;text-transform:uppercase;color:var(--blu-900);font-weight:600}
.scelta-griglia{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.scelta-griglia{grid-template-columns:1fr}}
.prod{background:#fff;border:1.5px solid var(--linea);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font-family:inherit;transition:.18s}
.prod:hover{border-color:var(--blu-700);box-shadow:0 8px 26px rgba(20,86,143,.16);transform:translateY(-2px)}
.prod-dis{background:var(--blu-050);border-bottom:1px solid var(--linea);padding:10px;min-height:150px;display:flex;align-items:center}
.prod-dis svg{width:100%;height:auto}
.prod-dis.foto{padding:0}
.prod-dis.foto img{width:100%;height:170px;object-fit:cover;display:block}
.prod-corpo{padding:18px 20px 20px}
.prod-corpo h3{margin:0 0 6px;font-size:24px;text-transform:uppercase;color:var(--blu-900);font-weight:600}
.prod-corpo p{margin:0;font-size:13.5px;color:var(--testo-2);line-height:1.5}
.conta{display:inline-block;margin-top:12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--blu-700);font-weight:600}
/* ---------- marginalità ---------- */
.marg-box{margin:0;border-left:4px solid var(--acciaio)}
.marg-box.ok{border-left-color:var(--ok)} .marg-box.ko{border-left-color:var(--err)}
.r-mg{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}
.r-mg strong{font-family:"IBM Plex Mono"}
.r-mg.grande{border-top:1px solid var(--linea);margin-top:6px;padding-top:10px;font-size:16px}
.r-mg.grande strong{font-family:"Barlow Condensed";font-size:24px;font-weight:700;color:var(--blu-900)}
textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--linea);border-radius:6px;width:100%}


.doc-legenda{list-style:none;margin:10px 0 0;padding:12px 14px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;
  background:#F2F7FB;border:1px solid #D5E3EF;border-radius:6px}
.doc-legenda li{display:flex;gap:8px;align-items:flex-start;break-inside:avoid}
.doc-legenda .nn{flex:0 0 19px;height:19px;border-radius:50%;background:#0B3A63;color:#fff;
  font-family:"IBM Plex Mono";font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.doc-legenda .tt{font-size:12px;font-weight:600;color:#0B3A63;line-height:1.3}
.doc-legenda em{display:block;font-style:normal;font-weight:400;font-size:11px;color:#5A6773;margin-top:1px}

input.senza-prezzo{background:#FFF6F5;border-color:#E6C3C0;color:var(--err)}
.chip.chip-ko{opacity:.5;border-style:dashed;color:var(--testo-2)}
.chip.chip-ko.sel{opacity:1;background:var(--err);border-color:var(--err);color:#fff}
/* ---------- documento staccionate: pagine fisse ---------- */
.pg-doc{display:flex;flex-direction:column;min-height:0}
.pg-doc .doc-piede{margin-top:auto}
.pg-2{margin-top:26px;padding-top:26px;border-top:2px dashed #C9D6E2}
.doc-head-2{align-items:center;padding-bottom:10px;border-bottom-width:1px}
.logo-piccolo{width:170px!important}
.doc-rif-2{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:10.5px;color:#5A6773}
.doc-rif-2 span:first-child{font-family:"IBM Plex Mono";color:#0B3A63;font-size:11.5px}
@media print{
  .pg-2{margin-top:0;padding-top:0;border-top:0;break-before:page;page-break-before:always}
  .pg-doc{min-height:calc(297mm - 32mm);break-inside:auto;page-break-inside:auto}
  .doc-tab,.doc-cond,.doc-firme,.doc-dis{break-inside:avoid;page-break-inside:avoid}
  .doc-tab tfoot{break-inside:avoid;page-break-inside:avoid}
}

/* ---------- documento casette ---------- */
.foglio-cas{padding:0;border:0;background:transparent;max-width:900px}
.foglio-cas .pg{background:#fff;border:1px solid var(--linea);border-radius:6px;padding:34px 38px;margin-bottom:18px;font-size:11pt;color:#1B242C;line-height:1.5}
.foglio-cas .lett{width:100%;display:block;margin-bottom:18px}
.foglio-cas .doc-title{text-align:center;margin-bottom:20px}
.foglio-cas .doc-title h1{font-size:26px;text-transform:uppercase;color:var(--blu-900);margin:0;font-weight:600}
.foglio-cas .doc-title h2{font-size:16px;color:var(--testo-2);margin:2px 0 0;font-weight:500;text-transform:uppercase;letter-spacing:.1em}
.foglio-cas .sez{font-family:"Barlow Condensed";font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--blu-900);padding:5px 12px;border-radius:3px;margin:18px 0 10px;font-weight:600}
.foglio-cas table.dati{width:100%;border-collapse:collapse;font-size:11pt}
.foglio-cas table.dati td{padding:6px 10px;border-bottom:1px solid #EDF1F4}
.foglio-cas table.dati td:first-child{width:220px;color:var(--testo-2);text-transform:uppercase;font-size:9.5pt;letter-spacing:.06em}
.foglio-cas .foto-wrap{margin-top:18px;text-align:center}
.foglio-cas .foto-wrap img{max-width:100%;max-height:330px;object-fit:contain;border:1px solid var(--linea);border-radius:4px}
.foglio-cas .cap{font-size:9pt;color:var(--testo-2);margin-top:5px}
.foglio-cas table.voci{width:100%;border-collapse:collapse}
.foglio-cas table.voci td{padding:10px;border-bottom:1px solid #EDF1F4;vertical-align:top}
.foglio-cas table.voci td.imp{text-align:right;white-space:nowrap;font-family:"IBM Plex Mono";width:130px}
.foglio-cas .vtit{font-weight:600;color:var(--blu-900);font-size:11pt;margin-bottom:3px}
.foglio-cas .vdesc{font-size:10pt;color:var(--testo-2);line-height:1.45}
.foglio-cas table.tt{width:100%;border-collapse:collapse;margin-top:12px;font-size:11pt}
.foglio-cas table.tt td{padding:7px 10px;text-align:right}
.foglio-cas table.tt td:first-child{text-align:left;color:var(--testo-2)}
.foglio-cas table.tt tr.fin td{background:var(--blu-900);color:#fff;font-weight:700;font-size:13pt}
.foglio-cas .note-min{font-size:9pt;color:#3A464F;white-space:pre-wrap;line-height:1.5}
.foglio-cas .firme{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}
.foglio-cas .firme .linea{border-top:1px solid #9AA6B0;padding-top:6px;font-size:9.5pt;color:var(--testo-2);margin-top:48px}
.foglio-cas .pfoot{margin-top:24px;padding-top:10px;border-top:1px solid var(--linea);font-size:7.5pt;color:var(--testo-2);text-align:center;line-height:1.4}
.foglio-cas .pfoot{margin-top:auto}
.foglio-cas .pfoot-mod{margin-top:3px;font-size:7pt;color:#93A0AB;letter-spacing:.06em}
.foglio-cas .pg{display:flex;flex-direction:column}
.cas-head-2{position:static;display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--blu-700)}
.cas-logo-2{width:170px;max-width:45%;height:auto;display:block}
.cas-rif-2{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:9.5pt;color:#5A6773}
.cas-rif-2 span:first-child{font-family:"IBM Plex Mono";color:#0B3A63;font-size:10pt}
.vl-attesa{color:#8A939B!important;font-style:italic;font-size:10.5px!important}
@media print{
  .pg-cas-2,.pg-cas-3{break-before:page;page-break-before:always}
  .foglio-cas .pg{min-height:calc(297mm - 32mm);page-break-after:auto}
  .foglio-cas table.voci,.foglio-cas table.tt,.foglio-cas .firme,.foglio-cas .foto-wrap,
  .foglio-cas table.dati,.cas-head-2{break-inside:avoid;page-break-inside:avoid}
}
@media print{ .foglio-cas .pg{border:0;border-radius:0;margin:0;padding:0;page-break-after:always} }

/* ---------- dialogo di conferma ---------- */
.modale{position:fixed;inset:0;background:rgba(11,58,99,.42);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px}
.modale-box{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:24px;box-shadow:0 18px 50px rgba(11,58,99,.3)}
.modale-box h3{margin:0 0 8px;font-size:22px;text-transform:uppercase;color:var(--blu-900);font-weight:600}
.modale-box p{margin:0 0 18px;color:var(--testo-2);font-size:14px}
.modale-az{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- pagina preventivo ---------- */
.riepilogo{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media(max-width:1000px){.riepilogo{grid-template-columns:1fr}}
.scheda-dis{border:1px solid var(--linea);border-radius:10px;background:#fff;overflow:hidden}
.scheda-head{display:flex;justify-content:space-between;gap:18px;padding:16px 18px 12px;border-bottom:1px solid var(--linea);flex-wrap:wrap;align-items:flex-start}
.tit-dis{margin:2px 0 0;font-size:22px;text-transform:uppercase;font-weight:600;color:var(--blu-900)}
.sintesi{display:flex;gap:20px;flex-wrap:wrap}
.sintesi div{text-align:right}
.sintesi span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--testo-2)}
.sintesi strong{font-family:"IBM Plex Mono";font-size:15px;color:var(--blu-900)}
.legenda{list-style:none;margin:0;padding:14px 18px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 20px;border-top:1px solid var(--linea);background:var(--blu-050)}
.legenda li{display:flex;gap:10px;align-items:flex-start}
.legenda .nn{flex:0 0 22px;height:22px;border-radius:50%;background:var(--blu-900);color:#fff;font-family:"IBM Plex Mono";font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.legenda .tt{font-size:14px;font-weight:600;color:var(--blu-900);line-height:1.3}
.legenda em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--testo-2);margin-top:1px}
.colonna-prezzi{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.colonna-prezzi .card.salva{margin:0}
.al-metro{margin-top:12px;border-top:1px solid rgba(255,255,255,.28);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.al-metro span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.al-metro strong{font-family:"Barlow Condensed";font-size:24px;font-weight:700}
table.distinta td{border-bottom:1px solid #EEF2F5}
table.distinta tr.cat td{background:var(--blu-050);font-family:"Barlow Condensed";font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--blu-900);border-bottom:1px solid var(--blu-100)}
table.distinta tr.cat:hover td{background:var(--blu-100)}
table.distinta td.cod{color:var(--testo-2);font-size:12.5px;white-space:nowrap}
table.distinta td.um{color:var(--testo-2);font-size:12.5px}
table.distinta em.nota{display:block;font-style:normal;font-size:11.5px;color:var(--testo-2);margin-top:1px}
table.distinta tfoot td{border-top:2px solid var(--linea);border-bottom:0;font-weight:600;color:var(--blu-900);padding-top:10px}
@media print{#testata,.steps,.nav-wz,.salva{display:none!important}.riepilogo{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--testo-2);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--linea);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #EDF1F4;vertical-align:middle}
tr:hover td{background:var(--blu-050)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono";font-size:13px}
.tab-wrap{overflow-x:auto}
table input,table select{padding:6px 8px;font-size:14px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--blu-100);color:var(--blu-900);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tot-box{background:linear-gradient(135deg,var(--blu-900),var(--blu-700));color:#fff;border-radius:10px;padding:24px}

.tot-box .r span:last-child{font-family:"IBM Plex Mono"}
.tot-box .r.fin{border-top:1px solid rgba(255,255,255,.3);margin-top:10px;padding-top:14px;font-size:20px;font-weight:600}
.tot-box .r.fin span:last-child{font-family:"Barlow Condensed";font-size:30px;font-weight:700}
.tot-box .r.sm{font-size:13px;opacity:.85}
.disegno{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:10px}
.disegno svg{width:100%;height:auto;display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--blu-900);color:#fff;padding:12px 22px;border-radius:8px;font-size:14px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.hidden{display:none!important}

.info{background:var(--blu-050);border:1px solid var(--blu-100);border-radius:8px;padding:12px 14px;font-size:13.5px;margin-top:12px}
.info strong{color:var(--blu-900)}

/* variante del montante secondo fissaggio e lavorazioni richieste */
function varianteMontante(c){
  const punta = c.fissaggio==="infisso";
  const fori = Number(c.fori)||0;
  if(c.sella && fori>0) return "SF";
  if(c.sella) return "SE";
  if(fori>=2) return "F2";
  if(fori===1) return "F1";
  return punta ? "TP" : "TT";
}
const NOME_VARIANTE = {TT:"liscio", TP:"con punta", MP:"mezzo palo",
  SE:"con sella", F1:"con 1 foro", F2:"con 2 fori", SF:"con sella e foro"};

/* Varianti ammesse per il montante secondo il fissaggio:
   con staffa serve la base piatta, quindi niente punta; murato e infisso
   accettano entrambe e si sceglie la più economica fra quelle idonee.      */
function variantiMontante(c){
  const fori = Number(c.fori)||0;
  if(c.sella && fori>0) return ["SF"];
  if(c.sella) return ["SE"];
  if(fori>=2) return ["F2"];
  if(fori===1) return ["F1","F2"];
  if(c.fissaggio==="bicchiere" || c.fissaggio==="fittone") return ["TT"];
  if(c.fissaggio==="infisso") return ["TP","TT"];
  return ["TT","TP"];
}
/* fra le varianti ammesse sceglie l'articolo idoneo più economico */
function articoloMontante(c, need){
  let best=null;
  variantiMontante(c).forEach(v=>{
    const a = articolo("Pali", v, c.montanteDiam, need);
    if(!a) return;
    const idoneo = Number(a.lung) >= need;
    const costo = Number(a.costo)||0;
    if(!best) { best={voce:a, variante:v, idoneo}; return; }
    if(idoneo && !best.idoneo) { best={voce:a, variante:v, idoneo}; return; }
    if(idoneo === best.idoneo){
      /* confronto il costo per montante: il palo liscio si può sezionare */
      const resa   = v==="TT" ? Math.max(1, Math.floor(Number(a.lung)/need)) : 1;
      const resaB  = best.variante==="TT" ? Math.max(1, Math.floor(Number(best.voce.lung)/need)) : 1;
      const unit   = costo/resa, unitB = (Number(best.voce.costo)||0)/resaB;
      if(unit < unitB - 0.001 ||
        (Math.abs(unit-unitB)<=0.001 && Number(a.lung) < Number(best.voce.lung)))
        best={voce:a, variante:v, idoneo};
    }
  });
  return best;
}

/* articolo più corto che copre la misura; null se la variante non esiste */
function articolo(cat,forma,diam,lungMin){
  const c = artCat(cat,forma).filter(x=>Number(x.diam)===Number(diam) && Number(x.lung)>0)
    .sort((a,b)=>a.lung-b.lung);
  if(!c.length) return null;
  return c.find(x=>Number(x.lung)>=Number(lungMin)) || c[c.length-1];
}
/* per gli orizzontali: l'articolo che copre più campate al minor costo per campata */
function articoloModulare(cat,forma,diam,passoCm){
  const c = artCat(cat,forma).filter(x=>Number(x.diam)===Number(diam) && Number(x.lung)>0);
  let best=null;
  c.forEach(v=>{
    const per = Math.floor(Number(v.lung)/passoCm);
    if(per<1) return;
    const scarto = Number(v.lung) - per*passoCm;
    const costoPer = (Number(v.costo)||0)/per;
    if(!best || costoPer < best.costoPer-0.001 ||
       (Math.abs(costoPer-best.costoPer)<=0.001 && (scarto<best.scarto ||
        (scarto===best.scarto && Number(v.lung)>Number(best.voce.lung)))))
      best={voce:v, per, scarto, costoPer};
  });
  if(!best && c.length){
    const v = c.sort((a,b)=>b.lung-a.lung)[0];
    best={voce:v, per:1, scarto:0, costoPer:Number(v.costo)||0, corto:true};
  }
  return best;
}
const voceCod = cod => listino.find(x=>x.cod===cod) || null;
function trovaFerramenta(forma,diam){
  const c = artCat("Ferramenta",forma).filter(x=>Number(x.diam)>0).sort((a,b)=>a.diam-b.diam);
  return c.find(x=>Number(x.diam)>=Number(diam)) || c[c.length-1] || null;
}

   CALCOLO — tutto su articoli finiti a catalogo
   ===================================================================== */
function lunghezzaPalo(c){
  const hF = Number(c.hFuori)||1;
  const f = FISSAGGI[c.fissaggio] || FISSAGGI.murato;
  const interro = !f.interrato ? 0 :
    (c.fissaggio==="infisso" ? (Number(param.interroInfisso)||60) : (Number(param.interroMurato)||50))/100;
  return { hF, interro, tot: hF + interro };
}

function calcola(c){
  const L = LAYOUT.find(l=>l.id===c.layout) || LAYOUT[0];
  const ml = Number(c.ml)||0;
  const inter = Number(c.interasse)||2;
  const geo = lunghezzaPalo(c);
  const campate = Math.max(1, Math.ceil(ml/inter));
  const montanti = campate + 1;
  const posa = c.posa!==false;

  const righe=[], mancanti=[], avvisi=[], sc={};
  const add=(cod,q,note)=>{
    const v=voceCod(cod); if(!v||q<=0) return;
    righe.push({cod, cat:v.cat, des:v.des, um:v.um, q, cu:Number(v.costo)||0, tot:q*(Number(v.costo)||0), note:note||""});
  };
  const addArt=(v,q,note)=>{
    if(!v||q<=0) return;
    righe.push({cod:v.cod, cat:v.cat, des:v.des, um:v.um, q, cu:Number(v.costo)||0, tot:q*(Number(v.costo)||0), note:note||""});
  };

  /* ---------- montanti ---------- */
  const needMont = geo.tot*100;
  const scelta = articoloMontante(c, needMont);
  const varMont = scelta ? scelta.variante : varianteMontante(c);
  if(scelta){
    const vMont = scelta.voce;
    /* solo il palo liscio si può sezionare: con punta, sella o fori la
       lavorazione sta a un'estremità e il pezzo resta uno solo. */
    const tagliabile = (varMont==="TT" || varMont==="TP");
    const perPezzo = (varMont==="TT")
      ? Math.max(1, Math.floor(Number(vMont.lung)/needMont)) : 1;
    const pezzi = Math.ceil(montanti/perPezzo);
    /* i pali già lavorati (sella, fori) si posano interi: la staccionata
       segue la loro lunghezza, non si accorciano. */
    const lungPosata = tagliabile ? needMont : Number(vMont.lung);
    addArt(vMont, pezzi, "montanti da "+num(lungPosata,0)+" cm ("+num(geo.hF*100,0)+" fuori terra"+
      (geo.interro>0? " + "+num(geo.interro*100,0)+" interrati":"")+")"+
      (perPezzo>1? " · "+perPezzo+" montanti per palo" : ""));
    if(tagliabile && (perPezzo>1 || Number(vMont.lung)>needMont+1))
      add("LV-TAGLIO", pezzi, "taglio a misura dei montanti");
    sc.montante = {voce:vMont, q:pezzi, montanti, perPezzo, need:needMont,
      lungPosata, variante:varMont, tagliabile};
    if(!scelta.idoneo)
      mancanti.push("montante Ø"+c.montanteDiam+" "+NOME_VARIANTE[varMont]+" da almeno "+num(needMont,0)+" cm (il più lungo a catalogo è "+vMont.lung+" cm)");
    else if(perPezzo===1 && Number(vMont.lung) > needMont + 45)
      avvisi.push("il montante più corto disponibile è di "+vMont.lung+" cm contro i "+num(needMont,0)+" necessari: resta "+num(vMont.lung-needMont,0)+" cm di scarto per palo");
  } else {
    mancanti.push("montante Ø"+c.montanteDiam+" "+NOME_VARIANTE[varianteMontante(c)]+" — non disponibile a catalogo");
  }

  /* ---------- fissaggio ---------- */
  let staffa=null;
  if(c.fissaggio==="bicchiere" || c.fissaggio==="fittone"){
    staffa = trovaFerramenta(c.fissaggio==="fittone"?"F":"B", c.montanteDiam);
    if(staffa){
      addArt(staffa, montanti);
      if(c.fissaggio==="bicchiere"){ if(posa) add("TF-CHIM", montanti*4, "4 tasselli per staffa"); }
      else if(posa){ add("PO-SCAVO", montanti, "scavo e getto per fittone"); add("PL-CLS", montanti); }
      if(Number(staffa.diam) < Number(c.montanteDiam))
        mancanti.push("staffa per palo Ø"+c.montanteDiam+" (la più grande a catalogo è Ø"+staffa.diam+"0)");
    } else mancanti.push("staffa per palo Ø"+c.montanteDiam);
    add("KGLEVO860", montanti*2, "fissaggio palo alla staffa");
  } else if(c.fissaggio==="murato"){ if(posa){ add("PL-CLS", montanti); add("PO-SCAVO", montanti); } }
  else if(c.fissaggio==="infisso"){ if(posa) add("PO-INFISS", montanti); }

  /* ---------- corrimano ---------- */
  let v8=0, v6=0, v5=0, faVoce=null;
  if(L.corrimano){
    const s = articoloModulare("Pali", c.corrimanoForma, c.corrimanoDiam, inter*100);
    if(s){
      const pezzi = Math.ceil(campate/s.per);
      addArt(s.voce, pezzi, s.corto ? "articolo più lungo disponibile per l'interasse scelto"
        : "1 pezzo copre "+s.per+(s.per===1?" campata":" campate")+(s.scarto>0? " · scarto "+num(s.scarto,0)+" cm":" · nessuno scarto"));
      if(s.scarto>0) add("LV-TAGLIO", pezzi, "taglio a misura del corrimano");
      sc.corrimano = {...s, pezzi};
    } else mancanti.push("corrimano Ø"+c.corrimanoDiam+" "+NOME_VARIANTE[c.corrimanoForma]);
    if(c.fascetta){
      faVoce = trovaFerramenta("U", c.montanteDiam);
      if(faVoce) addArt(faVoce, montanti); else mancanti.push("fissaggio ad U per palo Ø"+c.montanteDiam);
    } else v8 += montanti*2;
  }

  /* ---------- traverse orizzontali ---------- */
  const nCorr = Number(c.nCorrenti)||0;
  if(nCorr>0){
    const s = articoloModulare("Pali", c.correnteForma, c.correnteDiam, inter*100);
    if(s){
      const pezzi = Math.ceil(campate*nCorr/s.per);
      addArt(s.voce, pezzi, nCorr+(nCorr===1?" fila":" file")+" · 1 pezzo copre "+s.per+(s.per===1?" campata":" campate")+
        (s.scarto>0? " · scarto "+num(s.scarto,0)+" cm":" · nessuno scarto"));
      if(s.scarto>0) add("LV-TAGLIO", pezzi, "taglio a misura delle traverse");
      sc.correnti = {...s, pezzi};
    } else mancanti.push("traversa Ø"+c.correnteDiam+" "+NOME_VARIANTE[c.correnteForma]);
    v6 += montanti*nCorr*2;
    /* con i fori passanti le traverse non si avvitano */
    if(Number(c.fori)>0) v6 = Math.max(0, v6 - montanti*nCorr*2);
  }

  /* ---------- obliqui della croce ---------- */
  if(L.croce){
    const dg = Math.sqrt(inter*inter + geo.hF*geo.hF)*100;
    const obF = c.obliquoForma || "MP";
    const obD = c.obliquoDiam || c.correnteDiam;
    const vOb = articolo("Pali", obF, obD, dg);
    if(vOb){
      const perPezzo = Math.max(1, Math.floor(Number(vOb.lung)/dg));
      const pezzi = Math.ceil(campate*2/perPezzo);
      addArt(vOb, pezzi, "2 obliqui per campata da "+num(dg,0)+" cm"+(perPezzo>1? " · "+perPezzo+" obliqui per pezzo":""));
      add("LV-TAGLIO", campate*2, "taglio a misura degli obliqui");
      sc.obliqui = {voce:vOb, pezzi, need:dg, perPezzo};
      if(Number(vOb.lung) < dg) mancanti.push("obliquo Ø"+obD+" da almeno "+num(dg,0)+" cm");
    } else mancanti.push("obliquo Ø"+obD+" "+NOME_VARIANTE[obF]);
    if(obF!=="MP"){ add("LV-FETTA", campate*2*2, "2 tagli a fetta di salame per obliquo");
                    add("LV-INCAS", campate, "1 incastro a mezzo legno per incrocio"); }
    else if(c.incastro!==false) add("LV-INCAS", campate, "1 incastro a mezzo legno per incrocio");
    v6 += campate*4;
  }

  /* ---------- stecche verticali ---------- */
  if(L.stecche){
    const passo = Number(c.passoStecche)||0.12;
    const nSt = Math.floor(ml/passo);
    const hSt = geo.hF*0.92*100;
    const s = articoloModulare("Pali","TP", c.steccaDiam, hSt);
    if(s){
      const pezzi = Math.ceil(nSt/s.per);
      addArt(s.voce, pezzi, nSt+" stecche da "+num(hSt,0)+" cm a passo "+num(passo*100,0)+" cm"+
        (s.per>1? " · "+s.per+" stecche per pezzo":""));
      if(s.per>1 || s.scarto>0) add("LV-TAGLIO", pezzi, "taglio a misura delle stecche");
      sc.stecche = {...s, pezzi, nSt, need:hSt};
    } else mancanti.push("stecca Ø"+c.steccaDiam);
    v5 += nSt*Math.max(2,nCorr);
  }

  if(v8>0) add("KGLEVO860", Math.ceil(v8));
  if(v6>0) add("VL5X120", Math.ceil(v6));
  if(v5>0) add("VL45X80", Math.ceil(v5));
  if(posa) add("PO-ML", ml);

  /* ---------- prezzi ---------- */
  const costoPosa = righe.filter(r=>r.cat==="Posa").reduce((s,r)=>s+r.tot,0);
  const costoMat  = righe.filter(r=>r.cat!=="Posa").reduce((s,r)=>s+r.tot,0);
  const mM=1-(Number(param.margineMat)||0)/100, mP=1-(Number(param.marginePosa)||0)/100, pv=1-(Number(param.provvigione)||0)/100;
  const prezzoMat = mM>0? costoMat/mM/pv : costoMat;
  const prezzoPosa= mP>0? costoPosa/mP/pv : costoPosa;
  const trasporto = (c.conTrasporto===false) ? 0 : (Number(c.trasporto)||0);
  const imponibile = prezzoMat+prezzoPosa+trasporto;
  const iva = imponibile*(Number(param.iva)||0)/100;
  const senzaPrezzo = [...new Set(righe.filter(r=>!r.cu).map(r=>r.cod))];

  const map={}; righe.forEach(r=>{ if(map[r.cod]){ map[r.cod].q+=r.q; map[r.cod].tot+=r.tot; } else map[r.cod]={...r}; });

  return {layout:L, geo, campate, montanti, ml, inter, sc, staffa, faVoce, posa, varMont,
    mont: sc.montante, righe:Object.values(map), mancanti, avvisi, senzaPrezzo,
    costoMat, costoPosa, prezzoMat, prezzoPosa, trasporto,
    imponibile, iva, totale:imponibile+iva, alMetro: ml>0? imponibile/ml : 0};
}

/* =====================================================================
   DISEGNO — vista laterale in scala, mai tagliata
   ===================================================================== */
function disegna(c, opt){
  opt = opt||{};
  const mini = !!opt.mini;
  const L = LAYOUT.find(l=>l.id===c.layout) || LAYOUT[0];
  const inter = Number(c.interasse)||2;
  const geo = lunghezzaPalo(c);
  const hF = geo.hF, interro = geo.interro;
  const campate = mini? 2 : 3;
  const staffaAlta = (c.fissaggio==="bicchiere"||c.fissaggio==="fittone") ? 0.20 : 0;
  const fittone = c.fissaggio==="fittone" ? 0.35 : 0;

  /* area disegno */
  const W = mini? 640 : 1000;
  const mTop = mini? 12 : 52;
  const mBot = mini? 14 : 78;
  /* margini asimmetrici: a destra serve spazio per la quota dell'altezza,
     altrimenti il testo "xxx cm / fuori terra" esce dal riquadro */
  const mSx = mini? 30 : 58;
  const mDx = mini? 30 : 168;
  const sopra = hF + staffaAlta + 0.10;                    // m sopra il terreno
  const sotto = Math.max(interro, fittone, 0.22);          // m sotto il terreno
  /* la scala riempie la larghezza; l'altezza del foglio segue il disegno,
     così non resta la fascia vuota sotto la staccionata */
  let scala = (W - mSx - mDx) / (campate*inter);
  const maxH = mini? 205 : 520;
  if(mTop + (sopra+sotto)*scala + mBot > maxH) scala = (maxH - mTop - mBot)/(sopra+sotto);
  const H = Math.round(mTop + (sopra+sotto)*scala + mBot);
  const larg = campate*inter*scala;
  const x0 = mSx + (W - mSx - mDx - larg)/2;
  const suolo = mTop + sopra*scala;
  const px = m => x0 + m*scala;
  const py = m => suolo - m*scala;

  const wPal = Math.max(5,   (Number(c.montanteDiam)||10)/100*scala);
  const wCor = Math.max(3.5, (Number(c.correnteDiam)||8)/100*scala);
  const wCm  = Math.max(4.5, (Number(c.corrimanoDiam)||10)/100*scala);
  const wSt  = Math.max(3,   (Number(c.steccaDiam)||7)/100*scala);
  const wOb  = Math.max(3.5, (Number(c.obliquoDiam)||8)/100*scala) * ((c.obliquoForma||"MP")==="MP"? 0.62 : 1);
  const bordo = "#6B5430";
  const F = n => (isFinite(n)? n : 0).toFixed(1);
  /* Gli id di gradienti e pattern devono essere UNICI per ogni SVG della pagina:
     con id ripetuti il browser risolve il riferimento sul primo, spesso dentro una
     sezione nascosta, e i pali restano senza riempimento (solo i contorni). */
  const uid = "g" + (disegna.seq = (disegna.seq||0) + 1);
  const U = n => "url(#" + n + "-" + uid + ")";
  let s = "";

  /* ---- elementi in legno resi come cilindri ---- */
  const membV=(x,yT,yB,w,cap)=>{
    let o=`<rect x="${F(x-w/2)}" y="${F(yT)}" width="${F(w)}" height="${F(Math.max(yB-yT,1))}" fill="#B08C4F"/>`;
    o+=`<rect x="${F(x-w/2)}" y="${F(yT)}" width="${F(w)}" height="${F(Math.max(yB-yT,1))}" fill="${U('lgV')}" stroke="${bordo}" stroke-width="1"/>`;
    if(cap==="tondo")  o+=`<ellipse cx="${F(x)}" cy="${F(yT)}" rx="${F(w/2)}" ry="${F(Math.max(w*0.17,1.5))}" fill="#D2AE73" stroke="${bordo}" stroke-width="1"/>`;
    if(cap==="quadro") o+=`<rect x="${F(x-w/2)}" y="${F(yT-2.5)}" width="${F(w)}" height="4" fill="#D2AE73" stroke="${bordo}" stroke-width="1"/>`;
    if(cap==="sella")  o+=`<path d="M${F(x-w/2)},${F(yT-1)} Q${F(x)},${F(yT+w*0.62)} ${F(x+w/2)},${F(yT-1)} Z" fill="#FFFFFF" stroke="${bordo}" stroke-width="1"/>`;
    o+=`<line x1="${F(x-w*0.17)}" y1="${F(yT+w*0.6)}" x2="${F(x-w*0.17)}" y2="${F(yB-w*0.2)}" stroke="#8D6F3F" stroke-width=".7" opacity=".45"/>`;
    return o;
  };
  const membH=(xa,xb,yC,w)=>
    `<rect x="${F(xa)}" y="${F(yC-w/2)}" width="${F(Math.max(xb-xa,1))}" height="${F(w)}" rx="${F(w/2)}" fill="#B08C4F"/>`+
    `<rect x="${F(xa)}" y="${F(yC-w/2)}" width="${F(Math.max(xb-xa,1))}" height="${F(w)}" rx="${F(w/2)}" fill="${U('lgH')}" stroke="${bordo}" stroke-width="1"/>`+
    `<line x1="${F(xa+4)}" y1="${F(yC-w*0.2)}" x2="${F(xb-4)}" y2="${F(yC-w*0.2)}" stroke="#E0C48F" stroke-width="${F(Math.max(w*0.14,.8))}" opacity=".5"/>`;
  const membHm=(xa,xb,yBase,w)=>{            // mezzo palo: faccia piana in appoggio, dorso tondo
    const hh=Math.max(w*0.55,3), r=hh*0.55;
    const sagoma = `M${F(xa)},${F(yBase)} L${F(xa)},${F(yBase-hh+r)} Q${F(xa)},${F(yBase-hh)} ${F(xa+r)},${F(yBase-hh)} L${F(xb-r)},${F(yBase-hh)} Q${F(xb)},${F(yBase-hh)} ${F(xb)},${F(yBase-hh+r)} L${F(xb)},${F(yBase)} Z`;
    return `<path d="${sagoma}" fill="#B08C4F"/>`+
      `<path d="${sagoma}" fill="${U('lgM')}" stroke="${bordo}" stroke-width="1"/>`+
      `<line x1="${F(xa+4)}" y1="${F(yBase-hh*0.72)}" x2="${F(xb-4)}" y2="${F(yBase-hh*0.72)}" stroke="#E0C48F" stroke-width="${F(Math.max(hh*0.16,.8))}" opacity=".5"/>`+
      `<line x1="${F(xa)}" y1="${F(yBase)}" x2="${F(xb)}" y2="${F(yBase)}" stroke="${bordo}" stroke-width="1"/>`;
  };
  const membD=(xa,ya,xb,yb,w)=>
    `<line x1="${F(xa)}" y1="${F(ya)}" x2="${F(xb)}" y2="${F(yb)}" stroke="${bordo}" stroke-width="${F(w+2)}" stroke-linecap="round"/>`+
    `<line x1="${F(xa)}" y1="${F(ya)}" x2="${F(xb)}" y2="${F(yb)}" stroke="#B58F52" stroke-width="${F(w)}" stroke-linecap="round"/>`+
    `<line x1="${F(xa)}" y1="${F(ya)}" x2="${F(xb)}" y2="${F(yb)}" stroke="#DCC08B" stroke-width="${F(Math.max(w*0.22,.8))}" stroke-linecap="round" opacity=".55" transform="translate(0,${F(-w*0.22)})"/>`;
  /* fascetta a U: scavalca il corrimano e scende avvitata sulla testa del montante */
  const fascettaU=(x,yC,wRail)=>{
    const t  = Math.max(4.5, wPal*0.44);
    const gi = Math.max(9, 0.09*scala);                 // quanto scende sul montante
    return `<rect x="${F(x-t/2)}" y="${F(yC-wRail/2-3)}" width="${F(t)}" height="${F(wRail+3+gi)}" rx="${F(Math.min(3,t/2))}" fill="${U('mtl')}" stroke="#59626A" stroke-width="1"/>`+
           `<circle cx="${F(x)}" cy="${F(yC+wRail/2+gi*0.55)}" r="${F(Math.max(1.5,t*0.17))}" fill="#454D54"/>`;
  };
  const plinto=(x,h)=>{
    if(h<=0) return "";
    const wp = Math.max(wPal*2.3, 13);
    return `<path d="M${F(x-wp/2)},${F(suolo)} L${F(x+wp/2)},${F(suolo)} L${F(x+wp*0.34)},${F(suolo+h)} L${F(x-wp*0.34)},${F(suolo+h)} Z" fill="${U('cls')}" stroke="#9AA1A7" stroke-width="1"/>`;
  };

  /* ---- terreno ---- */
  const fineTerreno = suolo + sotto*scala;
  s += `<rect x="0" y="${F(suolo)}" width="${W}" height="${F(fineTerreno-suolo)}" fill="${U('terreno')}"/>`;
  s += `<line x1="0" y1="${F(fineTerreno)}" x2="${W}" y2="${F(fineTerreno)}" stroke="#CBBB99" stroke-width="1"/>`;

  const xs=[]; for(let i=0;i<=campate;i++) xs.push(px(i*inter));
  const xA=xs[0], xB=xs[xs.length-1];
  const yBaseP = staffaAlta>0 ? py(staffaAlta) : suolo;
  const yTop = yBaseP - hF*scala;
  const nC = Number(c.nCorrenti)||0;

  /* ---- opere interrate ---- */
  xs.forEach(x=>{
    if(c.fissaggio==="murato")  s += plinto(x, interro*scala);
    if(c.fissaggio==="fittone") s += plinto(x, fittone*scala);
    if(interro>0){
      const hi = interro*scala;
      if(c.fissaggio==="infisso"){
        const punta = Math.min(hi*0.5, wPal*1.8);          // palo puntato per l'infissione
        s += `<path d="M${F(x-wPal/2)},${F(suolo)} L${F(x+wPal/2)},${F(suolo)} L${F(x+wPal/2)},${F(suolo+hi-punta)} L${F(x)},${F(suolo+hi)} L${F(x-wPal/2)},${F(suolo+hi-punta)} Z" fill="#9C8452" stroke="${bordo}" stroke-width="1" stroke-dasharray="4 3" opacity=".92"/>`;
        s += `<line x1="${F(x-wPal/2)}" y1="${F(suolo+hi-punta)}" x2="${F(x+wPal/2)}" y2="${F(suolo+hi-punta)}" stroke="${bordo}" stroke-width=".8" opacity=".5"/>`;
      } else {
        s += `<rect x="${F(x-wPal/2)}" y="${F(suolo)}" width="${F(wPal)}" height="${F(hi)}" fill="#9C8452" stroke="${bordo}" stroke-width="1" stroke-dasharray="4 3" opacity=".92"/>`;
      }
    }
  });

  /* ---- correnti (dietro ai montanti se passano nei fori) ---- */
  const disegnaCorrenti=()=>{
    let o="";
    for(let i=1;i<=nC;i++){
      const y = yBaseP - (hF*i/(nC+1))*scala;
      o += (c.correnteForma==="MP") ? membHm(xA-10, xB+10, y+wCor/2, wCor)
                                   : membH (xA-10, xB+10, y, wCor);
    }
    return o;
  };
  const passanti = Number(c.fori)>0;
  if(nC>0 && passanti) s += disegnaCorrenti();

  /* ---- croce di Sant'Andrea ----
     mezzo palo: avvitato a fianco del montante, quindi passa davanti e arriva sull'asse del palo
     palo intero: tagliato a fetta, quindi si incastra tra un montante e l'altro           */
  const mezzoPalo = (c.obliquoForma||"MP")==="MP";
  let svgCroce="";
  if(L.croce){
    for(let i=0;i<campate;i++){
      const a=xs[i], b=xs[i+1];
      const xa = mezzoPalo? a : a+wPal/2, xb = mezzoPalo? b : b-wPal/2;
      const yLo = yBaseP-6, yHi = yTop+wCm;
      svgCroce += membD(xa, yLo, xb, yHi, wOb);
      svgCroce += membD(xb, yLo, xa, yHi, wOb);
      if(mezzoPalo){   // viti di fissaggio sui montanti
        [[xa,yLo],[xb,yHi],[xb,yLo],[xa,yHi]].forEach(pt=>{
          svgCroce += `<circle cx="${F(pt[0])}" cy="${F(pt[1])}" r="${F(Math.max(1.4,wOb*0.16))}" fill="#454D54"/>`;
        });
      }
      const xi=(xa+xb)/2, yi=(yLo+yHi)/2;
      if(c.incastro!==false){        // incastro a mezzo legno nell'incrocio
        svgCroce += `<rect x="${F(xi-wOb*0.85)}" y="${F(yi-wOb*0.85)}" width="${F(wOb*1.7)}" height="${F(wOb*1.7)}" rx="2" fill="none" stroke="#6B5430" stroke-width="1.2" opacity=".85" transform="rotate(45 ${F(xi)} ${F(yi)})"/>`;
        svgCroce += `<line x1="${F(xi-wOb*0.6)}" y1="${F(yi)}" x2="${F(xi+wOb*0.6)}" y2="${F(yi)}" stroke="#6B5430" stroke-width="1" opacity=".7"/>`;
      } else {
        svgCroce += `<circle cx="${F(xi)}" cy="${F(yi)}" r="${F(Math.max(1.5,wOb*0.18))}" fill="#454D54"/>`;
      }
    }
  }
  if(!mezzoPalo) s += svgCroce;

  /* ---- stecche verticali ---- */
  if(L.stecche){
    const passo=(Number(c.passoStecche)||0.12), hSt=hF*0.92;
    for(let x=xA+passo*scala/2; x<xB-2; x+=passo*scala)
      s += membV(x, yBaseP-hSt*scala, yBaseP, wSt, "tondo");
  }

  /* ---- montanti ---- */
  xs.forEach(x=>{
    const cap = c.sella ? "sella" : "tondo";
    s += membV(x, yTop, yBaseP, wPal, cap);
    if(staffaAlta>0){
      const hb=staffaAlta*scala;
      s += `<path d="M${F(x-wPal/2-3)},${F(suolo-hb)} L${F(x+wPal/2+3)},${F(suolo-hb)} L${F(x+wPal/2+3)},${F(suolo)} L${F(x-wPal/2-3)},${F(suolo)} Z" fill="${U('mtl')}" stroke="#59626A" stroke-width="1.1"/>`;
      s += `<circle cx="${F(x)}" cy="${F(suolo-hb*0.45)}" r="${F(Math.max(1.6,wPal*0.1))}" fill="#454D54"/>`;
      if(c.fissaggio==="bicchiere"){
        s += `<rect x="${F(x-wPal/2-15)}" y="${F(suolo-6)}" width="${F(wPal+30)}" height="6" fill="${U('mtl')}" stroke="#59626A" stroke-width="1"/>`;
        s += `<circle cx="${F(x-wPal/2-10)}" cy="${F(suolo-3)}" r="2" fill="#454D54"/><circle cx="${F(x+wPal/2+10)}" cy="${F(suolo-3)}" r="2" fill="#454D54"/>`;
      } else {
        s += `<rect x="${F(x-3.5)}" y="${F(suolo)}" width="7" height="${F(fittone*scala)}" fill="${U('mtl')}" stroke="#59626A" stroke-width="1"/>`;
        s += `<path d="M${F(x-3.5)},${F(suolo+fittone*scala)} L${F(x+3.5)},${F(suolo+fittone*scala)} L${F(x)},${F(suolo+fittone*scala+9)} Z" fill="#7B848B" stroke="#59626A" stroke-width="1"/>`;
      }
    }
  });

  /* ---- elementi avvitati in facciata ---- */
  if(mezzoPalo) s += svgCroce;
  if(nC>0 && !passanti) s += disegnaCorrenti();

  /* ---- corrimano e fascette ---- */
  if(L.corrimano){
    s += (c.corrimanoForma==="MP") ? membHm(xA-12, xB+12, yTop+wCm/2, wCm)
                                  : membH (xA-12, xB+12, yTop, wCm);
    if(c.fascetta) xs.forEach(x=>{ s += fascettaU(x, yTop, wCm); });
    else xs.forEach(x=>{ s += `<circle cx="${F(x)}" cy="${F(yTop)}" r="${F(Math.max(1.6,wCm*0.14))}" fill="#454D54"/>`; });
  }

  /* ---- linea di campagna sopra a tutto ---- */
  s += `<line x1="0" y1="${F(suolo)}" x2="${W}" y2="${F(suolo)}" stroke="#7D6E52" stroke-width="2"/>`;
  for(let x=8; x<W; x+=26){
    s += `<path d="M${x},${F(suolo)} l3,-6 M${x+4},${F(suolo)} l0,-7 M${x+8},${F(suolo)} l-2,-5" stroke="#8FA06A" stroke-width="1.3" fill="none" opacity=".8"/>`;
  }

  if(mini) return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${defs(uid)}${s}</svg>`;

  /* ---- quote ---- */
  const yQ = fineTerreno + 30;
  s += `<line x1="${F(xs[0])}" y1="${F(suolo+4)}" x2="${F(xs[0])}" y2="${F(yQ+8)}" stroke="#9FB4C7" stroke-width="1"/>`;
  s += `<line x1="${F(xs[1])}" y1="${F(suolo+4)}" x2="${F(xs[1])}" y2="${F(yQ+8)}" stroke="#9FB4C7" stroke-width="1"/>`;
  s += `<line x1="${F(xs[0])}" y1="${F(yQ)}" x2="${F(xs[1])}" y2="${F(yQ)}" stroke="#14568F" stroke-width="1.2" marker-start="${U('fr')}" marker-end="${U('fr')}"/>`;
  const xm2=(xs[0]+xs[1])/2;
  s += `<rect x="${F(xm2-40)}" y="${F(yQ-11)}" width="80" height="20" fill="#fff"/>`;
  s += `<text x="${F(xm2)}" y="${F(yQ+5)}" fill="#14568F" font-family="IBM Plex Mono,monospace" font-size="14" text-anchor="middle">${num(inter*100,0)} cm</text>`;
  s += `<text x="${F(xm2)}" y="${F(yQ+24)}" fill="#5A6773" font-family="Inter,sans-serif" font-size="12" text-anchor="middle">interasse montanti</text>`;

  const xQ = xB + 46;
  s += `<line x1="${F(xB)}" y1="${F(yTop)}" x2="${F(xQ+8)}" y2="${F(yTop)}" stroke="#9FB4C7" stroke-width="1"/>`;
  s += `<line x1="${F(xB)}" y1="${F(suolo)}" x2="${F(xQ+8)}" y2="${F(suolo)}" stroke="#9FB4C7" stroke-width="1"/>`;
  s += `<line x1="${F(xQ)}" y1="${F(yTop)}" x2="${F(xQ)}" y2="${F(suolo)}" stroke="#14568F" stroke-width="1.2" marker-start="${U('fr')}" marker-end="${U('fr')}"/>`;
  s += `<text x="${F(xQ+10)}" y="${F((yTop+suolo)/2-4)}" fill="#14568F" font-family="IBM Plex Mono,monospace" font-size="14">${num(hF*100,0)} cm</text>`;
  s += `<text x="${F(xQ+10)}" y="${F((yTop+suolo)/2+13)}" fill="#5A6773" font-family="Inter,sans-serif" font-size="11.5">fuori terra</text>`;
  if(interro>0){
    s += `<line x1="${F(xQ)}" y1="${F(suolo)}" x2="${F(xQ)}" y2="${F(suolo+interro*scala)}" stroke="#14568F" stroke-width="1.2" marker-start="${U('fr')}" marker-end="${U('fr')}"/>`;
    s += `<text x="${F(xQ+10)}" y="${F(suolo+interro*scala/2-1)}" fill="#14568F" font-family="IBM Plex Mono,monospace" font-size="13">${num(interro*100,0)} cm</text>`;
    s += `<text x="${F(xQ+10)}" y="${F(suolo+interro*scala/2+14)}" fill="#5A6773" font-family="Inter,sans-serif" font-size="11">interrati</text>`;
  }

  /* ---- richiami numerati: niente frecce che si accavallano ---- */
  const R2 = calcola(c);
  const voci = Array.isArray(opt.voci) ? opt.voci : [];
  let n = 0;
  const bollo=(x,y,testo,dett)=>{
    n++; voci.push({n, nome:testo, dett:dett||""});
    return `<circle cx="${F(x)}" cy="${F(y)}" r="11" fill="#0B3A63" stroke="#fff" stroke-width="2"/>`+
           `<text x="${F(x)}" y="${F(y+4.5)}" fill="#fff" font-family="IBM Plex Mono,monospace" font-size="12.5" font-weight="600" text-anchor="middle">${n}</text>`;
  };
  const meta=(a,b)=>(a+b)/2;
  if(L.corrimano){
    s += bollo(meta(xs[0],xs[1]), yTop, "Corrimano",
      (c.corrimanoForma==="MP"?"Mezzo palo Ø":"Tondo Ø")+c.corrimanoDiam+
      (R2.sc.corrimano? " · art. "+R2.sc.corrimano.voce.cod+" L."+R2.sc.corrimano.voce.lung+" cm" : ""));
    if(c.fascetta) s += bollo(xs[2], yTop-wCm*0.5-6, "Fascetta a U",
      "Zincata sopra il corrimano"+(R2.faVoce? " · "+R2.faVoce.cod : ""));
  }
  s += bollo(xs[1], yBaseP-hF*scala*0.62, "Montante",
    "Tondo Ø"+c.montanteDiam+
    (R2.sc.montante? " · art. "+R2.sc.montante.voce.cod+" h."+R2.sc.montante.voce.lung+" cm":"")+
    (c.sella?" · con sella":"")+(c.fori>0?" · "+c.fori+" fori":""));
  if(nC>0) s += bollo(meta(xs[2],xs[3]), yBaseP-(hF*1/(nC+1))*scala, nC===1? "Corrente orizzontale" : nC+" correnti orizzontali",
    (c.correnteForma==="MP"?"Mezzo palo Ø":"Tondo Ø")+c.correnteDiam+(passanti?" · passanti nei fori":" · avvitati in facciata"));
  if(L.croce) s += bollo(meta(xs[0],xs[1]), meta(yBaseP-6, yTop+wCm), "Obliqui incrociati",
    (mezzoPalo?"Mezzi pali avvitati a fianco":"Pali interi tagliati a fetta")+" Ø"+(c.obliquoDiam||c.correnteDiam)+
    ((c.incastro!==false||!mezzoPalo)?" · incastro a mezzo legno":" · sovrapposti e avvitati"));
  if(L.stecche) s += bollo(xs[2]+scala*0.16, yBaseP-hF*scala*0.28, "Stecche verticali",
    "Ø"+c.steccaDiam+" passo "+num((c.passoStecche||0.12)*100,0)+" cm"+
    (R2.sc.stecche? " · art. "+R2.sc.stecche.voce.cod+" h."+R2.sc.stecche.voce.lung+" cm":""));
  s += bollo(xs[0], staffaAlta>0? suolo-staffaAlta*scala*0.5 : suolo+Math.max(interro,0.12)*scala*0.55,
    FISSAGGI[c.fissaggio].nome,
    c.fissaggio==="bicchiere" ? "Tassellata su piano esistente"+(R2.staffa? " · "+R2.staffa.cod:"")
    : c.fissaggio==="fittone" ? "Fittone cementato nel terreno"+(R2.staffa? " · "+R2.staffa.cod:"")
    : c.fissaggio==="murato"  ? "Plinto in cls, "+num(interro*100,0)+" cm interrati"
    : "Battipalo, "+num(interro*100,0)+" cm interrati, palo puntato");

  /* ---- cartiglio ---- */
  s += `<text x="${F(x0)}" y="24" font-family="Barlow Condensed,sans-serif" font-size="21" font-weight="600" fill="#0B3A63" letter-spacing=".04em">${esc(L.nome.toUpperCase())} — VISTA LATERALE</text>`;
  s += `<text x="${F(x0)}" y="42" font-family="Inter,sans-serif" font-size="12" fill="#5A6773">Schema non in scala · quote in centimetri</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${defs(uid)}${s}</svg>`;
}

function renderArchivio(){
  const el=document.getElementById("v-archivio");
  let h=`<div class="titolo-sez"><div><div class="eyebrow">Staccionate</div><h2>Archivio</h2></div>
    <button class="btn btn-p" onclick="nuovoPreventivo()">Nuova staccionata</button></div>`;

  /* --- offerte a cliente --- */
  h+=`<div class="card"><div class="eyebrow">Offerte a cliente</div>`;
  if(!offerte.length){
    h+=`<p class="muted" style="margin:8px 0 0">Nessuna offerta salvata. Le offerte si salvano dal documento, dopo aver inserito il cliente.</p>`;
  } else {
    h+=`<div class="tab-wrap"><table class="distinta">
      <thead><tr><th>Numero</th><th>Cliente</th><th>Cantiere</th><th class="num">Sviluppo</th>
        <th class="num">Imponibile</th><th>Data</th><th></th></tr></thead><tbody>
      ${offerte.map((o,i)=>`<tr>
        <td class="mono cod">${esc(o.numero)}</td>
        <td>${esc(o.cliente||"—")}</td>
        <td>${esc(o.ubicazione||"—")}</td>
        <td class="num">${num((o.totali&&o.totali.ml)||0,0)} ml</td>
        <td class="num">${eur((o.totali&&o.totali.imponibile)||0)}</td>
        <td>${new Date(o.data_offerta).toLocaleDateString("it-IT")}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-s" style="padding:5px 12px;font-size:12.5px" onclick="apriOfferta(${i})">Apri</button>
          <button class="btn btn-d" style="padding:5px 10px;font-size:12.5px" onclick="eliminaOfferta(${i})">×</button></td>
      </tr>`).join("")}
    </tbody></table></div>`;
  }
  h+=`</div>`;

  /* --- modelli standard --- */
  h+=`<div class="titolo-sez" style="margin:24px 0 12px"><div><div class="eyebrow">Modelli ricorrenti</div>
    <h2 style="font-size:22px">Staccionate standard</h2></div></div>`;
  if(!standard.length){
    h+=`<div class="card vuoto"><h3>Nessun modello salvato</h3>
      <p class="muted">I modelli standard si ricalcolano da soli quando aggiorni i costi in listino.</p>
      <button class="btn btn-p" style="margin-top:14px" onclick="nuovoPreventivo()">Crea il primo modello</button></div>`;
  } else {
    h+=`<div class="griglia-std">`;
    standard.forEach((s,i)=>{
      const r=calcola(s.conf);
      h+=`<article class="std">
        <div class="thumb">${disegna(s.conf,{mini:true})}</div>
        <div class="body"><h3>${esc(s.nome)}</h3>
          <div class="meta">${esc(r.layout.nome)} · interasse ${num(s.conf.interasse*100,0)} cm · h ${num(s.conf.hFuori*100,0)} cm<br>
          montante Ø${s.conf.montanteDiam} da ${num(r.geo.tot*100,0)} cm · ${r.montanti} pz su ${num(s.conf.ml,0)} ml<br>
          <span class="badge">${esc(FISSAGGI[s.conf.fissaggio].nome)}</span>
          ${s.conf.posa===false? `<span class="badge">sola fornitura</span>`:""}
          ${s.conf.conTrasporto===false? `<span class="badge">franco sede</span>`:""}</div>
          <div class="prezzo">${eur(r.alMetro)} <small>/ ml imponibile</small></div>
          <div class="muted" style="margin-top:2px">Totale ${num(s.conf.ml,0)} ml: ${eur(r.imponibile)} + IVA</div>
        </div>
        <div class="azioni">
          <button class="btn btn-s" onclick="apriStandard(${i})">Apri</button>
          <button class="btn btn-g" onclick="duplicaStandard(${i})">Duplica</button>
          <button class="btn btn-d" onclick="eliminaStandard(${i})">Elimina</button>
        </div></article>`;
    });
    h+=`</div>`;
  }
  el.innerHTML=h;
}
function apriStandard(i){ conf=JSON.parse(JSON.stringify(standard[i].conf)); conf._nome=standard[i].nome; conf._id=standard[i].id; step=5; vai("nuovo"); renderWizard(); }
async function duplicaStandard(i){
  try{
    const r=await db("prev_standard",{method:"POST",
      body:{prodotto, nome:standard[i].nome+" (copia)", conf:standard[i].conf, creato_da:sess&&sess.uid}});
    standard.push({id:r[0].id, nome:r[0].nome, conf:r[0].conf}); renderArchivio(); toast("Modello duplicato");
  }catch(e){ toast("Duplicazione non riuscita: "+e.message); }
}
function eliminaStandard(i){
  chiedi("Eliminare la staccionata?", "«"+standard[i].nome+"» verrà tolta dall'archivio. L'operazione non si può annullare.",
    async ()=>{
      try{ await db("prev_standard?id=eq."+standard[i].id,{method:"DELETE"}); standard.splice(i,1); renderArchivio(); toast("Modello eliminato"); }
      catch(e){ toast("Eliminazione non riuscita: "+e.message); }
    });
}

    if(L.corrimano){

/* riepilogo della variante scelta e delle alternative realmente disponibili */
function varianteDisponibile(){
  const need = lunghezzaPalo(conf).tot*100;
  const s = articoloMontante(conf, need);
  const v = s ? s.variante : varianteMontante(conf);
  if(s && s.idoneo) return "";
  /* propongo le combinazioni che esistono davvero */
  const alt=[];
  [6,8,10,12,14].forEach(d=>{
    const x=articoloMontante({...conf, montanteDiam:d}, need);
    if(x && x.idoneo) alt.push("Ø"+d+" "+NOME_VARIANTE[x.variante]+" (L."+x.voce.lung+" cm)");
  });
  return `<div class="avviso"><strong>Combinazione non disponibile:</strong> montante Ø${conf.montanteDiam}
    ${esc(NOME_VARIANTE[v])} da almeno ${num(need,0)} cm non esiste a catalogo.
    ${alt.length? "Alternative disponibili per questa altezza: "+esc(alt.slice(0,8).join(" · ")) : "Nessuna alternativa per questa altezza."}</div>`;

async function salvaComeStandard(){
  const nome=(document.getElementById("nome-std").value||"").trim();
  if(!nome){ toast("Dai un nome al modello prima di salvarlo"); return; }
  const c=JSON.parse(JSON.stringify(conf)); delete c._nome; delete c._id;
  try{
    if(conf._id){
      await db("prev_standard?id=eq."+conf._id,{method:"PATCH", body:{nome, conf:c}});
      const i=standard.findIndex(x=>x.id===conf._id); if(i>=0) standard[i]={id:conf._id,nome,conf:c};
    } else {
      const r=await db("prev_standard",{method:"POST", body:{prodotto:"staccionate", nome, conf:c, creato_da:sess&&sess.uid}});
      standard.push({id:r[0].id, nome:r[0].nome, conf:r[0].conf});

/* ---------- numerazione progressiva ----------
   Chiede il prossimo numero al database; se la chiamata non riesce,
   lo ricava dai numeri già presenti in archivio, così un'offerta salvata
   ha SEMPRE un numero progressivo e mai il segnaposto. */
const SEGNAPOSTO_NUM = "da assegnare al salvataggio";
function numeroAssegnato(n){ return !!n && n !== SEGNAPOSTO_NUM; }

async function prossimoNumero(prod){
  const pref = prod==="casette" ? "CAS" : "ST";
  const anno = new Date().getFullYear();
  try{
    const n = await rpc("prev_prossimo_numero",{p_prodotto:prod});
    const val = (typeof n==="string") ? n : (n && (n.prev_prossimo_numero||n[0]));
    if(val) return String(val);
    throw new Error("numero vuoto");
  }catch(e){
    /* ripiego: massimo progressivo fra le offerte già in archivio di quest'anno */
    let max = 0;
    try{
      const righe = await db("prev_offerte?prodotto=eq."+prod+"&select=numero");
      (righe||[]).forEach(x=>{
        const m = String(x.numero||"").match(new RegExp("^"+pref+"-"+anno+"-(\\d+)$"));
        if(m) max = Math.max(max, parseInt(m[1],10));
      });
    }catch(err){}
    return pref+"-"+anno+"-"+String(max+1).padStart(3,"0");
  }
}

/* ---------- offerte a cliente ---------- */
async function salvaOfferta(){
  const r=calcola(conf);
  try{
    if(!conf._offertaId || !numeroAssegnato(conf.numOfferta))
      conf.numOfferta = await prossimoNumero("staccionate");
    const corpo={prodotto:"staccionate", numero:conf.numOfferta, nome:conf._nome||"",
      cliente:conf.cliente||"", ubicazione:conf.rifCantiere||"",
      conf:conf, totali:{imponibile:r.imponibile, iva:r.iva, totale:r.totale, alMetro:r.alMetro, ml:conf.ml},
      creato_da:sess&&sess.uid};
    if(conf._offertaId){ await db("prev_offerte?id=eq."+conf._offertaId,{method:"PATCH", body:corpo}); }
    else { const o=await db("prev_offerte",{method:"POST", body:corpo}); conf._offertaId=o[0].id; offerte.unshift(o[0]); }
    renderDocumento();
    toast(conf.cliente? "Offerta "+conf.numOfferta+" salvata in archivio"
                      : "Offerta "+conf.numOfferta+" salvata — ricordati di inserire il cliente");
  }catch(e){ toast("Salvataggio non riuscito: "+e.message); }
}
function apriOfferta(i){
  const o=offerte[i];
  conf=JSON.parse(JSON.stringify(o.conf)); conf._offertaId=o.id; conf.numOfferta=o.numero;
  step=5; vai("nuovo"); renderWizard();
}
function eliminaOfferta(i){
  const o=offerte[i];
  chiedi("Eliminare l'offerta?", "L'offerta "+o.numero+(o.cliente? " per "+o.cliente:"")+" verrà tolta dall'archivio.",
    async ()=>{
      try{ await db("prev_offerte?id=eq."+o.id,{method:"DELETE"}); offerte.splice(i,1); renderArchivio(); toast("Offerta eliminata"); }
      catch(e){ toast("Eliminazione non riuscita: "+e.message); }
    });
}

/* il disegno è un SVG: per il PDF lo converto prima in immagine */
function svgInImmagine(svg, scala){
  return new Promise((ok,ko)=>{
    try{
      const vb=(svg.getAttribute("viewBox")||"0 0 1000 440").split(/\s+/).map(Number);
      const w=vb[2]||1000, hh=vb[3]||440, k=scala||2;
      const clone=svg.cloneNode(true);
      clone.setAttribute("width",w); clone.setAttribute("height",hh);
      clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
      const testo=new XMLSerializer().serializeToString(clone);
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement("canvas");
        cv.width=w*k; cv.height=hh*k;
        const cx=cv.getContext("2d");
        cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img,0,0,cv.width,cv.height);
        ok({url:cv.toDataURL("image/png"), w, h:hh});
      };
      img.onerror=()=>ko(new Error("svg non convertibile"));
      img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(testo);
    }catch(e){ ko(e); }
  });
}

async function preparaFoglio(sel){
  const orig=document.querySelector(sel||".foglio");
  const clone=orig.cloneNode(true);
  clone.classList.add("su-carta");
  /* i campi compilabili diventano testo */
  clone.querySelectorAll(".solo-video").forEach(el=>el.remove());
  clone.querySelectorAll(".solo-carta").forEach(el=>{ el.style.display="block"; });
  /* ogni pagina successiva alla prima parte da un foglio nuovo */
  clone.querySelectorAll(".pg-2,.pg-cas-2,.pg-cas-3").forEach(el=>{
    el.style.pageBreakBefore="always";
    el.style.breakBefore="page";
    el.style.marginTop="0";
    el.style.paddingTop="0";
    el.style.borderTop="0";
  });
  /* il disegno diventa immagine */
  const svg=orig.querySelector(".doc-dis svg");
  if(svg){
    try{
      const im=await svgInImmagine(svg,2);
      const box=clone.querySelector(".doc-dis");
      box.innerHTML=`<img src="${im.url}" style="width:100%;display:block">`;
    }catch(e){}
  }
  return clone;
}

/* html2canvas disegna solo le immagini già decodificate: aspetto il logo */
function attendiImmagini(nodo){
  const img = [...nodo.querySelectorAll("img")];
  return Promise.all(img.map(i=>{
    if(i.complete && i.naturalWidth>0) return Promise.resolve();
    return new Promise(ok=>{ i.onload=ok; i.onerror=ok; setTimeout(ok,3000); });
  }));
}

/* Adatta il foglio al formato A4 prima di generare il PDF.
   L'altezza utile di una pagina, in pixel del clone, vale
   larghezza × (altezza utile mm / larghezza utile mm).
   Se una pagina sfora, allargo il clone: html2pdf lo riduce alla larghezza
   della pagina, quindi tutto rimpicciolisce e il contenuto rientra.        */
function adattaPagine(contenitore, clone, margini){
  const [mt,mr,mb,ml] = margini;
  const rapporto = (297-mt-mb) / (210-ml-mr);
  const pagine = [...clone.querySelectorAll(".pg-doc, .foglio-cas .pg")];
  if(!pagine.length) return {larghezza:800, altezzaPagina:800*rapporto};

  let larghezza = 800;
  for(const w of [800, 870, 940, 1010, 1090, 1170, 1260]){
    larghezza = w;
    contenitore.style.width = w+"px";
    pagine.forEach(p=>{ p.style.height="auto"; });
    const limite = w*rapporto - 6;          // 6 px di margine di sicurezza
    const sfora = pagine.some(p=>p.scrollHeight > limite);
    if(!sfora) break;
  }
  const altezzaPagina = larghezza*rapporto;
  /* altezza fissa: il piè di pagina va in fondo al foglio e la pagina
     successiva parte pulita, senza code di contenuto */
  pagine.forEach(p=>{
    p.style.height = altezzaPagina+"px";
    p.style.overflow = "hidden";
  });
  return {larghezza, altezzaPagina};
}

async function scaricaPdf(sel, nomeFile){
  const b=document.getElementById(sel? "btn-pdf-cas":"btn-pdf");
  if(typeof html2pdf==="undefined"){ toast("Generatore PDF non disponibile, uso la stampa"); stampaDoc(); return; }
  if(b){ b.disabled=true; b.textContent="Preparo il PDF…"; }
  try{
    const margini=[12,10,12,10];
    const clone=await preparaFoglio(sel);
    const invisibile=document.createElement("div");
    invisibile.style.cssText="position:fixed;left:-10000px;top:0;width:800px;background:#fff";
    invisibile.appendChild(clone); document.body.appendChild(invisibile);
    await attendiImmagini(clone);
    adattaPagine(invisibile, clone, margini);
    const nome=((nomeFile||("Preventivo "+((conf&&conf.numOfferta)||"staccionata")+(conf&&conf.cliente? " "+conf.cliente:"")))
      .replace(/[\/\\:*?"<>|]/g,"-"))+".pdf";
    await html2pdf().set({
      margin:margini, filename:nome,
      image:{type:"jpeg", quality:0.96},
      html2canvas:{scale:2, useCORS:true, backgroundColor:"#ffffff"},
      jsPDF:{unit:"mm", format:"a4", orientation:"portrait"},
      pagebreak:{mode:["css","legacy"],
        before:[".pg-2",".pg-cas-2",".pg-cas-3"],
        avoid:[".doc-tab",".doc-cond",".doc-firme",".doc-dis",".doc-legenda",
               ".foglio-cas table.voci",".foglio-cas table.tt",".foglio-cas .firme",
               ".foglio-cas .foto-wrap",".foglio-cas table.dati"]}
    }).from(clone).save();
    invisibile.remove();
    toast("PDF salvato");
  }catch(e){ toast("Non riesco a generare il PDF: "+e.message); }
  if(b){ b.disabled=false; b.textContent="Scarica il PDF"; }
}

let proposta = null, analisiInCorso = false;

function importaFile(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async e=>{
    let righe=[];
    try{
      if(f.name.toLowerCase().endsWith(".csv")){
        const txt=e.target.result, sep=(txt.split("\n")[0]||"").includes(";")?";":",";
        righe=txt.split(/\r?\n/).filter(r=>r.trim()).map(r=>r.split(sep).map(c=>c.replace(/^"|"$/g,"").trim()));
      } else {
        if(typeof XLSX==="undefined"){ toast("Per i file Excel serve la connessione. Usa un CSV."); return; }
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
        righe=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).filter(r=>r.length);
      }
    }catch(err){ toast("Non riesco a leggere il file: "+err.message); return; }
    if(!righe.length){ toast("Il file sembra vuoto"); return; }
    analisiInCorso = true; proposta = null; renderListino();
    try{
      proposta = await analizzaConAI(righe, f.name);
    }catch(err){
      analisiInCorso = false;
      toast("Analisi non riuscita, provo l'abbinamento per colonne");
      importaClassico(righe); return;
    }
    analisiInCorso = false;
    if(!proposta || (!proposta.aggiornamenti.length && !proposta.nuovi.length)){
      toast("Nessuna corrispondenza trovata, provo l'abbinamento per colonne");
      importaClassico(righe); return;
    }
    renderListino();
  };
  f.name.toLowerCase().endsWith(".csv")? rd.readAsText(f,"UTF-8") : rd.readAsArrayBuffer(f);
  inp.value="";
}

/* l'AI legge il file com'è e lo abbina alle voci di listino, senza colonne obbligatorie */
async function analizzaConAI(righe, nomeFile){
  const tabella = righe.slice(0,150).map(r=>r.map(c=>String(c??"").trim()).join(" | ")).join("\n").slice(0,12000);
  const lst = listino.map(v=>({cod:v.cod, des:v.des, um:v.um, cat:v.cat, forma:v.forma||"", diam:v.diam||0, costo:v.costo}));
  const prompt = `Devi allineare il listino di un preventivatore di staccionate in legno con il file prezzi del fornitore.

LISTINO ATTUALE (JSON):
${JSON.stringify(lst)}

FILE CARICATO "${nomeFile}" (righe grezze, separatore |):
${tabella}

Regole di abbinamento:
- Abbina per SIGNIFICATO, non per codice: sezione o diametro (Ø8, Ø10, 10x10...), forma (palo tondo, mezzo palo, quadro), tipo di accessorio (fascetta a U, staffa a bicchiere, staffa a fittone, vite, tassello), tipo di lavorazione (sella, foro, puntatura, taglio a fetta di salame, incastro a mezzo legno, taglio a misura), posa.
- Il legname del listino è a metro lineare (um ml): se il file dà un prezzo a barra o a pezzo con lunghezza nota, dividi per la lunghezza in metri e restituisci il prezzo al metro.
- Converti le virgole decimali in punto. Ignora IVA, sconti già applicati, righe di intestazione o non pertinenti.
- Se una voce del file non esiste in listino ma è chiaramente utile, mettila in "nuovi" con categoria tra Legname, Lavorazioni, Ferramenta, Posa.
- Non inventare prezzi: includi solo voci realmente presenti nel file.

Rispondi SOLO con JSON compatto, senza testo né backtick:
{"aggiornamenti":[{"cod":"LG-T12","costo":4.35,"origine":"testo breve della riga del file"}],"nuovi":[{"cod":"LG-T16","cat":"Legname","forma":"T","diam":16,"um":"ml","des":"Palo tondo Ø16 pino autoclave","costo":7.20,"origine":"..."}],"note":"una frase"}`;

  const resp = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content:prompt}]})
  });
  const data = await resp.json();
  let testo = (data.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");
  testo = testo.replace(/```json|```/g,"").trim();
  const i=testo.indexOf("{"), j=testo.lastIndexOf("}");
  if(i<0||j<0) throw new Error("risposta non interpretabile");
  const out = JSON.parse(testo.slice(i,j+1));
  const agg = (out.aggiornamenti||[]).filter(a=>a && a.cod && isFinite(a.costo) && voce(a.cod));
  const nuo = (out.nuovi||[]).filter(n=>n && n.cod && isFinite(n.costo) && !voce(n.cod));
  agg.forEach(a=>{ a.sel=true; a.attuale = costoDi(a.cod); });
  nuo.forEach(n=>{ n.sel=true; });
  return {aggiornamenti:agg, nuovi:nuo, note:out.note||"", file:nomeFile};
}

function togliProposta(){ proposta=null; renderListino(); }
function selProposta(tipo,i,v){ proposta[tipo][i].sel=v; }
async function applicaProposta(){
  let a=0,n=0;
  try{
    for(const x of proposta.aggiornamenti.filter(x=>x.sel)){
      const v=voce(x.cod); if(!v) continue;
      v.costo=Number(x.costo)||0; await salvaVoce(v); a++;
    }
    const nuovi=proposta.nuovi.filter(x=>x.sel).map(x=>({prodotto, cod:x.cod, cat:x.cat||"Altro",
      forma:x.forma||"", diam:Number(x.diam)||0, lung:0, um:x.um||"pz", des:x.des||x.cod, costo:Number(x.costo)||0}));
    if(nuovi.length){ const r=await db("prev_listino",{method:"POST", body:nuovi}); (r||[]).forEach(v=>listino.push(v)); n=nuovi.length; }
    proposta=null; renderListino();
    toast(a+" prezzi aggiornati, "+n+" articoli aggiunti — per tutti i colleghi");
  }catch(e){ toast("Aggiornamento non riuscito: "+e.message); }
}
function pannelloProposta(){
  if(analisiInCorso) return `<div class="card" style="border-color:var(--blu-500)">
    <div class="eyebrow">Lettura del file</div>
    <h3 class="tit-dis">Sto analizzando il listino del fornitore…</h3>
    <p class="muted">Abbino le voci del file alle voci del listino: diametri, forme, accessori e lavorazioni.</p></div>`;
  if(!proposta) return "";
  const rigaA=(x,i)=>`<tr>
    <td><input type="checkbox" style="width:auto" ${x.sel?"checked":""} onchange="selProposta('aggiornamenti',${i},this.checked)"></td>
    <td class="mono cod">${esc(x.cod)}</td><td>${esc(descDi(x.cod))}<em class="nota">${esc(x.origine||"")}</em></td>
    <td class="num">${num(x.attuale)}</td>
    <td class="num" style="color:${Number(x.costo)>Number(x.attuale)?"var(--err)":"var(--ok)"};font-weight:600">${num(x.costo)}</td>
    <td class="num">${x.attuale? (((x.costo-x.attuale)/x.attuale)*100).toFixed(1)+" %" : "—"}</td></tr>`;
  const rigaN=(x,i)=>`<tr>
    <td><input type="checkbox" style="width:auto" ${x.sel?"checked":""} onchange="selProposta('nuovi',${i},this.checked)"></td>
    <td class="mono cod">${esc(x.cod)}</td><td>${esc(x.des)}<em class="nota">${esc(x.cat)}${x.origine? " · "+esc(x.origine):""}</em></td>
    <td class="num">—</td><td class="num" style="font-weight:600">${num(x.costo)}</td><td class="num">nuovo</td></tr>`;
  return `<div class="card" style="border-color:var(--blu-500);box-shadow:0 0 0 3px rgba(20,86,143,.1)">
    <div class="titolo-sez" style="margin-bottom:10px">
      <div><div class="eyebrow" style="margin:0">Da ${esc(proposta.file)}</div>
        <h3 class="tit-dis">Aggiornamenti proposti</h3></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-p" onclick="applicaProposta()">Applica selezionati</button>
        <button class="btn btn-g" onclick="togliProposta()">Annulla</button>
      </div>
    </div>
    ${proposta.note? `<p class="muted" style="margin-top:0">${esc(proposta.note)}</p>`:""}
    <div class="tab-wrap"><table class="distinta">
      <thead><tr><th style="width:34px"></th><th>Codice</th><th>Voce di listino</th>
        <th class="num">Attuale</th><th class="num">Nuovo</th><th class="num">Varia.</th></tr></thead>
      <tbody>
        ${proposta.aggiornamenti.length? `<tr class="cat"><td colspan="6">Prezzi da aggiornare (${proposta.aggiornamenti.length})</td></tr>`:""}
        ${proposta.aggiornamenti.map(rigaA).join("")}
        ${proposta.nuovi.length? `<tr class="cat"><td colspan="6">Articoli nuovi (${proposta.nuovi.length})</td></tr>`:""}
        ${proposta.nuovi.map(rigaN).join("")}
      </tbody></table></div>
    <p class="muted" style="margin-bottom:0">Controlla le righe prima di applicare: l'abbinamento è automatico e va verificato.</p>
  </div>`;
}

/* ripiego senza AI: abbinamento per intestazioni di colonna */
async function importaClassico(righe){
  const head=(righe[0]||[]).map(x=>String(x).toLowerCase());
  const f_=(...k)=>head.findIndex(x=>k.some(y=>x.includes(y)));
  const ic=f_("cod"), ica=f_("categ"), id=f_("desc"), ifo=f_("forma"),
        idi=f_("diam","ø"), il=f_("lung","altez"), iu=f_("um","unit"), ip=f_("cost","prezzo");
  if(ic<0||ip<0){ toast("Non trovo le colonne codice e costo"); return; }
  let agg=0; const nuovi=[];
  for(const r of righe.slice(1)){
    const cod=String(r[ic]||"").trim(); if(!cod) continue;
    const costo=Number(String(r[ip]).replace(",","."))||0;
    const ex=voce(cod);
    if(ex){ ex.costo=costo; if(id>=0&&r[id]) ex.des=String(r[id]); await salvaVoce(ex); agg++; }
    else nuovi.push({prodotto, cod, cat: ica>=0?String(r[ica]||"Altro"):"Altro",
      des: id>=0?String(r[id]||cod):cod, forma: ifo>=0?String(r[ifo]||""):"",
      diam: idi>=0?Number(r[idi])||0:0, lung: il>=0?Number(r[il])||0:0,
      um: iu>=0?String(r[iu]||"pz"):"pz", costo});
  }
  if(nuovi.length){ const r=await db("prev_listino",{method:"POST", body:nuovi}); (r||[]).forEach(v=>listino.push(v)); }
  renderListino(); toast(agg+" costi aggiornati, "+nuovi.length+" articoli nuovi");
}

/* backup completo di listino, parametri e archivio */
function esportaBackup(){
  const dati={versione:2, prodotto, data:new Date().toISOString(), listino, param, standard, offerte};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(dati,null,1)],{type:"application/json"}));
  a.download="backup-"+prodotto+"-"+new Date().toISOString().slice(0,10)+".json"; a.click();
}
function importaBackup(inp){
  const f=inp.files[0]; if(!f) return;
  toast("Il ripristino da backup va fatto con cautela: chiedimelo in chat e lo eseguo sul database.");
  inp.value="";
}
